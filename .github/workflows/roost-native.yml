name: Build Roost Native APK

on:
  push:
    branches: [main]
    paths:
      - 'raven-native/**'
      - '.github/workflows/roost-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # 固定签名：复用言叽那把 keystore（自分发 APK 不上架 Play，两个自己的 app 共用
      # 一把签名 key 完全正常），这样不用再去网页里加一个新 secret。alias 是 "yanji"。
      # ⚠️ 随机签名 = 每次都是「另一个 app」，装新包会冲突，只能卸载重装 = 聊天记录清零。
      # 所以这一步失败就必须让整个构建失败，绝不能悄悄产出一个随机签名的包。
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.YANJI_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::YANJI_KEYSTORE_B64 secret 不存在。没有固定签名的包一旦装上，"
            echo "::error::以后每次更新都得卸载重装（= 聊天记录清零），所以这里直接失败。"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > /tmp/roost-release.p12
          echo "ROOST_KEYSTORE_FILE=/tmp/roost-release.p12" >> "$GITHUB_ENV"
          echo "ROOST_KEYSTORE_PASS=android" >> "$GITHUB_ENV"
          echo "ROOST_KEYSTORE_ALIAS=yanji" >> "$GITHUB_ENV"
          echo "固定签名已启用（复用言叽 keystore）"

      # 1014：新图标是画师只许自用的，不在仓库里（她 19:40 填好了仓库密钥）。用仓库密钥 ROOST_BUILD_KEY 从自己服务器取，
      # 盖到仓库里的旧乌鸦图标上再打包。没有这把钥匙就停下，不打出一个旧图标的包。
      - name: Fetch private icons
        env:
          BUILD_KEY: ${{ secrets.ROOST_BUILD_KEY }}
        run: |
          if [ -z "$BUILD_KEY" ]; then
            echo "::error::ROOST_BUILD_KEY 仓库密钥不存在，拿不到新图标，停下。"
            exit 1
          fi
          mkdir -p /tmp/priv
          curl -fsS --retry 3 -H "X-Roost-Build-Key: $BUILD_KEY" \
            https://memory.ravenlove.cc/raven/build/private-icons.tgz -o /tmp/priv/icons.tgz
          tar -xzf /tmp/priv/icons.tgz -C /tmp/priv
          cp /tmp/priv/static/home-icon-crow-512.png raven/home-icon-crow-512.png
          for d in /tmp/priv/native-res/drawable-*; do
            mkdir -p "raven-native/app/src/main/res/$(basename "$d")"
            cp "$d"/ic_notification.png "raven-native/app/src/main/res/$(basename "$d")/"
          done
          # 同名的矢量版和 PNG 版不能并存，留 PNG
          rm -f raven-native/app/src/main/res/drawable/ic_notification.xml
          echo "新图标就位"

      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          for dpi in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${dpi%%:*}"
            size="${dpi##*:}"
            mkdir -p "raven-native/app/src/main/res/mipmap-${name}"
            convert raven/home-icon-crow-512.png -resize "${size}x${size}" \
              "raven-native/app/src/main/res/mipmap-${name}/ic_launcher.png"
          done

      - name: Build debug APK
        working-directory: raven-native
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # 1014：失败日志和包都传回自己服务器，不发公开 Release（包里有不能公开的图标）
      - name: Send build log on failure
        if: failure()
        env:
          BUILD_KEY: ${{ secrets.ROOST_BUILD_KEY }}
        run: |
          [ -n "$BUILD_KEY" ] && [ -f /tmp/build.log ] && curl -fsS -X POST -H "X-Roost-Build-Key: $BUILD_KEY" \
            --data-binary @/tmp/build.log "https://memory.ravenlove.cc/raven/build/upload?kind=log&run=${{ github.run_number }}" || true

      - name: Send APK to server
        env:
          BUILD_KEY: ${{ secrets.ROOST_BUILD_KEY }}
        run: |
          curl -fsS --retry 3 -X POST -H "X-Roost-Build-Key: $BUILD_KEY" -H "Content-Type: application/octet-stream" \
            --data-binary @raven-native/app/build/outputs/apk/debug/app-debug.apk \
            "https://memory.ravenlove.cc/raven/build/upload?kind=apk&run=${{ github.run_number }}"
