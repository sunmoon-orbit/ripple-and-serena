name: Build Shiyu Once

on:
  push:
    paths:
      - "shiyu-src/**"
      - ".github/workflows/shiyu-build-once.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shiyu-src/package-lock.json
      - name: Build Shiyu
        working-directory: shiyu-src
        run: |
          npm ci
          npm run build
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shiyu
          git diff --cached --quiet && exit 0
          git commit -m "chore: build shiyu [skip ci]"
          git push
