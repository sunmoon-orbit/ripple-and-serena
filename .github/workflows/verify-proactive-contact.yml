name: Verify proactive contact wiring

on:
  push:
    branches:
      - codex/proactive-contact-wiring
    paths:
      - 'yanji-src/**'
      - 'yanji-native/**'
      - '.github/workflows/verify-proactive-contact.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'yanji-src/**'
      - 'yanji-native/**'
      - '.github/workflows/verify-proactive-contact.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: yanji-src/package.json
      - name: Install web dependencies
        working-directory: yanji-src
        run: npm install
      - name: Run web tests
        working-directory: yanji-src
        run: npm test
      - name: Build web app
        working-directory: yanji-src
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare non-secret build inputs
        run: |
          cp yanji-app/google-services.json yanji-native/app/google-services.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          for dpi in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${dpi%%:*}"
            size="${dpi##*:}"
            mkdir -p "yanji-native/app/src/main/res/mipmap-${name}"
            convert yanji-src/public/icon-512.png -resize "${size}x${size}" "yanji-native/app/src/main/res/mipmap-${name}/ic_launcher.png"
          done
      - name: Run Android unit tests and compile debug APK
        working-directory: yanji-native
        run: gradle testDebugUnitTest assembleDebug --no-daemon --max-workers=1 --stacktrace
