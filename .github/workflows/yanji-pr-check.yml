name: Check Yanji PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'yanji-src/**'
      - '.github/workflows/yanji-pr-check.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yanji-src/package.json

      - name: Install dependencies
        working-directory: yanji-src
        run: npm install

      - name: Test
        working-directory: yanji-src
        run: npm test

      - name: Build
        working-directory: yanji-src
        run: npm run build
