<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071321">
  <meta http-equiv="refresh" content="0;url=https://sunmoon-orbit.github.io/chaomu/zhaohua/">
  <title>昭华已搬家</title>
</head>
<body>
  <p>昭华已搬到「日月轨道·朝暮」，正在前往新地址…</p>
  <p><a href="https://sunmoon-orbit.github.io/chaomu/zhaohua/">点此进入昭华</a></p>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.filter(r => r.scope.includes('/ripple-and-serena/zhaohua/')).map(r => r.unregister()))
        }
        if ('caches' in window) {
          const keys = await caches.keys()
          await Promise.all(keys.filter(k => k.startsWith('zhaohua-')).map(k => caches.delete(k)))
        }
      } finally {
        location.replace('https://sunmoon-orbit.github.io/chaomu/zhaohua/')
      }
    })()
  </script>
</body>
</html>
