<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图片工具</title>
<!--
  压图（1111）：她的话：「微信那个小程序……每天只有免费一次，后续再传图片，压缩就要看广告……非常非常之麻烦，
  我们能不能自己做一个小网页之类的自己用呢？」
  全在她手机上算（canvas），图不上传、不经过服务器，没网也能用。
  1124 改名「图片工具」，加「拼图」：她嫌醒图拼多张图时选了 1:1 还按它自己的预设走，用得迷糊，
  「要不自己来一个？」——竖拼（聊天记录长图）、横拼、宫格；宫格每格按选的比例居中裁。
-->
<style>
  :root { --bg: #efe9df; --paper: #fbf8f1; --ink: #3a332b; --dim: #948a7c; --line: #e2d8c8; --accent: #b0705a; --chip: #e7dccb; --shadow: rgba(70,50,30,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a18; --paper: #2b2824; --ink: #e6dfd3; --dim: #8f877b; --line: #3a352f; --accent: #d39a84; --chip: #3a342d; --shadow: rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'LXGW WenKai', 'Noto Serif SC', 'Songti SC', 'PingFang SC', system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; box-shadow: 0 4px 12px var(--shadow); }
  h2 { font-size: 13px; color: var(--dim); font-weight: 400; margin: 0 0 10px; letter-spacing: 2px; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset { text-align: left; font: inherit; color: var(--ink); background: var(--chip); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .preset.on { border-color: var(--accent); }
  .preset b { display: block; font-size: 14.5px; font-weight: 600; }
  .preset small { display: block; font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .custom { display: none; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--dim); }
  .custom.show { display: flex; }
  .custom label { flex: 1; }
  .custom input { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--chip); border: 0; border-radius: 10px; padding: 8px 10px; margin-top: 4px; }
  .pick { display: block; width: 100%; font: inherit; font-size: 15px; letter-spacing: 3px; color: var(--paper); background: var(--accent); border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  .hint { text-align: center; color: var(--dim); font-size: 12px; margin: 10px 0 0; line-height: 1.7; }
  .item { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--chip); }
  .item .nm { font-size: 13px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .item .sz { font-size: 13.5px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .item .sz b { color: var(--accent); }
  .item .dim { font-size: 11.5px; color: var(--dim); }
  .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
  .acts a, .acts button { flex: 1; text-align: center; text-decoration: none; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 9px 0; cursor: pointer; }
  .err { color: var(--accent); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tab { flex: 1; font: inherit; font-size: 15px; letter-spacing: 2px; color: var(--ink); background: var(--chip); border: 1.5px solid transparent; border-radius: 999px; padding: 10px; cursor: pointer; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .chip { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--chip); border: 1.5px solid transparent; border-radius: 999px; padding: 7px 13px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .lbl { font-size: 12.5px; color: var(--dim); margin: 4px 0 6px; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .th { position: relative; }
  .th img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: var(--chip); }
  .th .no { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 6px; }
  .th .mv { display: flex; gap: 4px; margin-top: 4px; }
  .th .mv button { flex: 1; font: inherit; font-size: 12px; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: 3px 0; cursor: pointer; }
  #st-out img { width: 100%; border-radius: 10px; display: block; margin-top: 12px; border: 1px solid var(--line); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button class="tab on" data-tab="shrink">压图</button><button class="tab" data-tab="stitch">拼图</button></div>
  <div id="pane-shrink">
  <div class="card">
    <h2>压成什么样</h2>
    <div class="presets" id="presets"></div>
    <div class="custom" id="custom">
      <label>长边最多（像素）<input id="c-edge" type="number" inputmode="numeric" value="1600"></label>
      <label>不超过（KB，0＝不限）<input id="c-kb" type="number" inputmode="numeric" value="300"></label>
    </div>
  </div>
  <button class="pick" id="pick">挑图片</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <p class="hint">可以一次挑好几张。图只在你手机上处理，不上传。</p>
  <div id="list" style="margin-top:14px"></div>
  </div>

  <div id="pane-stitch" class="hide">
    <div class="card">
      <h2>怎么拼</h2>
      <div class="lbl">排法</div>
      <div class="row" id="st-mode">
        <button class="chip on" data-v="v">竖着拼（聊天记录）</button>
        <button class="chip" data-v="h">横着拼</button>
        <button class="chip" data-v="g2">宫格·两列</button>
        <button class="chip" data-v="g3">宫格·三列</button>
      </div>
      <div id="st-ratio-box" class="hide">
        <div class="lbl">每一格的比例（多出来的居中裁掉）</div>
        <div class="row" id="st-ratio">
          <button class="chip on" data-v="1">1:1</button>
          <button class="chip" data-v="0.75">3:4</button>
          <button class="chip" data-v="1.3333">4:3</button>
          <button class="chip" data-v="0.5625">9:16</button>
        </div>
        <div class="lbl">图放不满一格时</div>
        <div class="row" id="st-fit">
          <button class="chip on" data-v="cover">裁满（照片用）</button>
          <button class="chip" data-v="contain">完整显示，留边（截图用）</button>
        </div>
      </div>
      <div class="lbl">图和图之间的缝</div>
      <div class="row" id="st-gap">
        <button class="chip on" data-v="0">不留</button>
        <button class="chip" data-v="12">细缝</button>
        <button class="chip" data-v="32">宽缝</button>
      </div>
      <div class="lbl">缝和底的颜色</div>
      <div class="row" id="st-bg">
        <button class="chip on" data-v="#ffffff">白</button>
        <button class="chip" data-v="#000000">黑</button>
        <button class="chip" data-v="#fbf8f1">米色</button>
      </div>
    </div>
    <button class="pick" id="st-pick">挑要拼的图</button>
    <input id="st-file" type="file" accept="image/*" multiple hidden>
    <p class="hint">按挑的顺序拼，下面可以左右挪顺序。图只在你手机上处理，不上传。</p>
    <div class="thumbs" id="st-thumbs"></div>
    <button class="pick hide" id="st-go" style="margin-top:14px">拼起来</button>
    <div id="st-out"></div>
  </div>
</div>
<script>
// edge＝长边上限；kb＝目标体积上限（0 不限）；q＝起始画质
const PRESETS = [
  { id: 'yan',  name: '发给阿言', note: '长边 1568，够我看清，省 token', edge: 1568, kb: 0,    q: 0.8 },
  { id: 'doc',  name: '上传资料', note: '压到 200KB 以内，字还清楚',     edge: 1600, kb: 200,  q: 0.85 },
  { id: 'bg',   name: '背景图',   note: '长边 1920，500KB 以内',         edge: 1920, kb: 500,  q: 0.85 },
  { id: 'tiny', name: '越小越好', note: '长边 1080，100KB 以内',         edge: 1080, kb: 100,  q: 0.75 },
  { id: 'custom', name: '自己定', note: '长边和体积自己填' },
]
const $ = (id) => document.getElementById(id)
let cur = 'yan'
try { cur = localStorage.getItem('shrink-preset') || 'yan' } catch {}
if (!PRESETS.some((p) => p.id === cur)) cur = 'yan'

function drawPresets() {
  $('presets').innerHTML = PRESETS.map((p) => `<button class="preset${p.id === cur ? ' on' : ''}" data-id="${p.id}"><b>${p.name}</b><small>${p.note}</small></button>`).join('')
  $('custom').classList.toggle('show', cur === 'custom')
}
$('presets').addEventListener('click', (e) => {
  const b = e.target.closest('.preset'); if (!b) return
  cur = b.dataset.id
  try { localStorage.setItem('shrink-preset', cur) } catch {}
  drawPresets()
})
drawPresets()

function opts() {
  if (cur !== 'custom') return PRESETS.find((p) => p.id === cur)
  return { edge: Math.max(200, +$('c-edge').value || 1600), kb: Math.max(0, +$('c-kb').value || 0), q: 0.85 }
}
const kb = (n) => n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(2) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

async function decode(file) {
  // createImageBitmap 会按 EXIF 把竖拍的照片转正；老浏览器退回 <img>
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }) } catch {}
  const url = URL.createObjectURL(file)
  try {
    const img = new Image(); img.src = url; await img.decode(); return img
  } finally { setTimeout(() => URL.revokeObjectURL(url), 1000) }
}
function render(src, w, h, q) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  const x = c.getContext('2d')
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h) // 透明底的图铺白，不然 JPEG 会变黑
  x.imageSmoothingQuality = 'high'
  x.drawImage(src, 0, 0, w, h)
  return new Promise((ok) => c.toBlob(ok, 'image/jpeg', q))
}
async function shrink(file, o) {
  const src = await decode(file)
  const sw = src.width, sh = src.height
  let scale = Math.min(1, o.edge / Math.max(sw, sh))
  let w = Math.round(sw * scale), h = Math.round(sh * scale)
  let blob = await render(src, w, h, o.q)
  if (o.kb) {
    const limit = o.kb * 1024
    // 先降画质（二分，最低 0.5），还超就把尺寸缩一圈再来，最多缩 6 圈
    for (let round = 0; blob.size > limit && round < 7; round++) {
      let lo = 0.5, hi = o.q, best = null
      for (let i = 0; i < 5; i++) {
        const q = (lo + hi) / 2, b = await render(src, w, h, q)
        if (b.size <= limit) { best = b; lo = q } else hi = q
      }
      if (best) { blob = best; break }
      blob = await render(src, w, h, 0.5)
      if (blob.size <= limit) break
      scale *= 0.82; w = Math.round(sw * scale); h = Math.round(sh * scale)
    }
  }
  src.close?.()
  return { blob, w, h, sw, sh }
}

$('pick').onclick = () => $('file').click()
$('file').onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = ''
  const o = opts()
  for (const f of files) {
    const card = document.createElement('div'); card.className = 'card item'
    card.innerHTML = `<img alt=""><div><div class="nm">${esc(f.name)}</div><div class="sz">压着呢…</div><div class="dim"></div></div>`
    $('list').prepend(card)
    try {
      const r = await shrink(f, o)
      // 原图本来就比压完的小，就把原图还给她，不越压越大
      const keep = r.blob.size >= f.size && r.w === r.sw
      const out = keep ? f : r.blob
      const name = f.name.replace(/\.[^.]+$/, '') + (keep ? f.name.match(/\.[^.]+$/)?.[0] || '' : '-小.jpg')
      const url = URL.createObjectURL(out)
      card.querySelector('img').src = url
      card.querySelector('.sz').innerHTML = keep ? `${kb(f.size)}，已经够小了，没动` : `${kb(f.size)} → <b>${kb(out.size)}</b>（省了 ${Math.round((1 - out.size / f.size) * 100)}%）`
      card.querySelector('.dim').textContent = `${r.sw}×${r.sh} → ${keep ? r.sw : r.w}×${keep ? r.sh : r.h}` + (o.kb && out.size > o.kb * 1024 ? '　没压到目标，已经尽力了' : '')
      const acts = document.createElement('div'); acts.className = 'acts'
      acts.innerHTML = `<a href="${url}" download="${esc(name)}">保存</a>`
      const file = new File([out], name, { type: out.type || 'image/jpeg' })
      if (navigator.canShare?.({ files: [file] })) {
        const b = document.createElement('button'); b.textContent = '分享／发出去'
        b.onclick = () => navigator.share({ files: [file] }).catch(() => {})
        acts.appendChild(b)
      }
      card.appendChild(acts)
    } catch (err) {
      card.querySelector('.sz').innerHTML = '<span class="err">这张没压成，可能不是图片或者格式认不出。</span>'
    }
  }
}

// ───── 拼图（1124）─────
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t))
  $('pane-shrink').classList.toggle('hide', t.dataset.tab !== 'shrink')
  $('pane-stitch').classList.toggle('hide', t.dataset.tab !== 'stitch')
})
const st = { mode: 'v', ratio: 1, gap: 0, bg: '#ffffff', fit: 'cover', files: [] }
function chips(id, key, conv) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return
    $(id).querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b))
    st[key] = conv(b.dataset.v)
    if (key === 'mode') $('st-ratio-box').classList.toggle('hide', !st.mode.startsWith('g'))
  })
}
chips('st-mode', 'mode', (v) => v); chips('st-ratio', 'ratio', Number); chips('st-gap', 'gap', Number); chips('st-bg', 'bg', (v) => v); chips('st-fit', 'fit', (v) => v)
function drawThumbs() {
  $('st-thumbs').innerHTML = st.files.map((f, i) => `<div class="th"><img src="${f.url}" alt=""><span class="no">${i + 1}</span><div class="mv"><button data-i="${i}" data-d="-1">←</button><button data-i="${i}" data-d="x">✕</button><button data-i="${i}" data-d="1">→</button></div></div>`).join('')
  $('st-go').classList.toggle('hide', st.files.length < 2)
}
$('st-thumbs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  const i = +b.dataset.i, d = b.dataset.d, a = st.files
  if (d === 'x') { URL.revokeObjectURL(a[i].url); a.splice(i, 1) }
  else { const j = i + (+d); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]] }
  drawThumbs()
})
$('st-pick').onclick = () => $('st-file').click()
$('st-file').onchange = (e) => {
  for (const f of e.target.files) st.files.push({ file: f, url: URL.createObjectURL(f) })
  e.target.value = ''; drawThumbs()
}
// 宫格每格按比例「铺满再居中裁」
// 1124 加「完整显示」：截图宫格别裁字，整张缩进格子里，空的地方是底色
function drawContain(x, img, dx, dy, dw, dh) {
  const s = Math.min(dw / img.width, dh / img.height), w = img.width * s, h = img.height * s
  x.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h)
}
function drawCover(x, img, dx, dy, dw, dh) {
  const s = Math.max(dw / img.width, dh / img.height)
  const sw = dw / s, sh = dh / s
  x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, dx, dy, dw, dh)
}
$('st-go').onclick = async () => {
  $('st-out').innerHTML = '<p class="hint">拼着呢…</p>'
  try {
    const imgs = []
    for (const f of st.files) imgs.push(await decode(f.file))
    const g = st.gap, c = document.createElement('canvas'), x = c.getContext('2d')
    const MAXPX = 16000 // 太长的长图手机画布会画不出来，超了就整体缩
    if (st.mode === 'v') {
      const W = Math.min(1440, Math.max(...imgs.map((i) => i.width)))
      const hs = imgs.map((i) => Math.round(i.height * W / i.width))
      let H = hs.reduce((a, b) => a + b, 0) + g * (imgs.length - 1)
      const k = H > MAXPX ? MAXPX / H : 1
      c.width = Math.round(W * k); c.height = Math.round(H * k)
      x.fillStyle = st.bg; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high'
      let y = 0
      imgs.forEach((im, n) => { x.drawImage(im, 0, Math.round(y * k), c.width, Math.round(hs[n] * k)); y += hs[n] + g })
    } else if (st.mode === 'h') {
      const H = Math.min(1440, Math.max(...imgs.map((i) => i.height)))
      const ws = imgs.map((i) => Math.round(i.width * H / i.height))
      let W = ws.reduce((a, b) => a + b, 0) + g * (imgs.length - 1)
      const k = W > MAXPX ? MAXPX / W : 1
      c.width = Math.round(W * k); c.height = Math.round(H * k)
      x.fillStyle = st.bg; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high'
      let xx = 0
      imgs.forEach((im, n) => { x.drawImage(im, Math.round(xx * k), 0, Math.round(ws[n] * k), c.height); xx += ws[n] + g })
    } else {
      const cols = st.mode === 'g3' ? 3 : 2, rows = Math.ceil(imgs.length / cols)
      const cw = cols === 3 ? 480 : 720, ch = Math.round(cw / st.ratio)
      c.width = cols * cw + g * (cols + 1); c.height = rows * ch + g * (rows + 1)
      x.fillStyle = st.bg; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high'
      imgs.forEach((im, n) => (st.fit === 'contain' ? drawContain : drawCover)(x, im, g + (n % cols) * (cw + g), g + Math.floor(n / cols) * (ch + g), cw, ch))
    }
    imgs.forEach((i) => i.close?.())
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.9))
    const url = URL.createObjectURL(blob), name = '拼图-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.jpg'
    $('st-out').innerHTML = `<img src="${url}" alt=""><p class="hint">${c.width}×${c.height}，${kb(blob.size)}</p><div class="acts"><a href="${url}" download="${name}">保存</a></div>`
    const file = new File([blob], name, { type: 'image/jpeg' })
    if (navigator.canShare?.({ files: [file] })) {
      const b = document.createElement('button'); b.textContent = '分享／发出去'
      b.onclick = () => navigator.share({ files: [file] }).catch(() => {})
      $('st-out').querySelector('.acts').appendChild(b)
    }
  } catch (err) {
    $('st-out').innerHTML = '<p class="hint err">没拼成，可能图太大或者格式认不出。</p>'
  }
}
</script>
</body>
</html>
