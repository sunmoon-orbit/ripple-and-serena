<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>压图</title>
<!--
  压图（1111）：她的话：「微信那个小程序……每天只有免费一次，后续再传图片，压缩就要看广告……非常非常之麻烦，
  我们能不能自己做一个小网页之类的自己用呢？」
  全在她手机上算（canvas），图不上传、不经过服务器，没网也能用。
-->
<style>
  :root { --bg: #efe9df; --paper: #fbf8f1; --ink: #3a332b; --dim: #948a7c; --line: #e2d8c8; --accent: #b0705a; --chip: #e7dccb; --shadow: rgba(70,50,30,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a18; --paper: #2b2824; --ink: #e6dfd3; --dim: #8f877b; --line: #3a352f; --accent: #d39a84; --chip: #3a342d; --shadow: rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'LXGW WenKai', 'Noto Serif SC', 'Songti SC', 'PingFang SC', system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; box-shadow: 0 4px 12px var(--shadow); }
  h2 { font-size: 13px; color: var(--dim); font-weight: 400; margin: 0 0 10px; letter-spacing: 2px; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset { text-align: left; font: inherit; color: var(--ink); background: var(--chip); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .preset.on { border-color: var(--accent); }
  .preset b { display: block; font-size: 14.5px; font-weight: 600; }
  .preset small { display: block; font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .custom { display: none; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--dim); }
  .custom.show { display: flex; }
  .custom label { flex: 1; }
  .custom input { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--chip); border: 0; border-radius: 10px; padding: 8px 10px; margin-top: 4px; }
  .pick { display: block; width: 100%; font: inherit; font-size: 15px; letter-spacing: 3px; color: var(--paper); background: var(--accent); border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  .hint { text-align: center; color: var(--dim); font-size: 12px; margin: 10px 0 0; line-height: 1.7; }
  .item { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--chip); }
  .item .nm { font-size: 13px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .item .sz { font-size: 13.5px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .item .sz b { color: var(--accent); }
  .item .dim { font-size: 11.5px; color: var(--dim); }
  .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
  .acts a, .acts button { flex: 1; text-align: center; text-decoration: none; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 9px 0; cursor: pointer; }
  .err { color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>压成什么样</h2>
    <div class="presets" id="presets"></div>
    <div class="custom" id="custom">
      <label>长边最多（像素）<input id="c-edge" type="number" inputmode="numeric" value="1600"></label>
      <label>不超过（KB，0＝不限）<input id="c-kb" type="number" inputmode="numeric" value="300"></label>
    </div>
  </div>
  <button class="pick" id="pick">挑图片</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <p class="hint">可以一次挑好几张。图只在你手机上处理，不上传。</p>
  <div id="list" style="margin-top:14px"></div>
</div>
<script>
// edge＝长边上限；kb＝目标体积上限（0 不限）；q＝起始画质
const PRESETS = [
  { id: 'yan',  name: '发给阿言', note: '长边 1568，够我看清，省 token', edge: 1568, kb: 0,    q: 0.8 },
  { id: 'doc',  name: '上传资料', note: '压到 200KB 以内，字还清楚',     edge: 1600, kb: 200,  q: 0.85 },
  { id: 'bg',   name: '背景图',   note: '长边 1920，500KB 以内',         edge: 1920, kb: 500,  q: 0.85 },
  { id: 'tiny', name: '越小越好', note: '长边 1080，100KB 以内',         edge: 1080, kb: 100,  q: 0.75 },
  { id: 'custom', name: '自己定', note: '长边和体积自己填' },
]
const $ = (id) => document.getElementById(id)
let cur = 'yan'
try { cur = localStorage.getItem('shrink-preset') || 'yan' } catch {}
if (!PRESETS.some((p) => p.id === cur)) cur = 'yan'

function drawPresets() {
  $('presets').innerHTML = PRESETS.map((p) => `<button class="preset${p.id === cur ? ' on' : ''}" data-id="${p.id}"><b>${p.name}</b><small>${p.note}</small></button>`).join('')
  $('custom').classList.toggle('show', cur === 'custom')
}
$('presets').addEventListener('click', (e) => {
  const b = e.target.closest('.preset'); if (!b) return
  cur = b.dataset.id
  try { localStorage.setItem('shrink-preset', cur) } catch {}
  drawPresets()
})
drawPresets()

function opts() {
  if (cur !== 'custom') return PRESETS.find((p) => p.id === cur)
  return { edge: Math.max(200, +$('c-edge').value || 1600), kb: Math.max(0, +$('c-kb').value || 0), q: 0.85 }
}
const kb = (n) => n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(2) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

async function decode(file) {
  // createImageBitmap 会按 EXIF 把竖拍的照片转正；老浏览器退回 <img>
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }) } catch {}
  const url = URL.createObjectURL(file)
  try {
    const img = new Image(); img.src = url; await img.decode(); return img
  } finally { setTimeout(() => URL.revokeObjectURL(url), 1000) }
}
function render(src, w, h, q) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  const x = c.getContext('2d')
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h) // 透明底的图铺白，不然 JPEG 会变黑
  x.imageSmoothingQuality = 'high'
  x.drawImage(src, 0, 0, w, h)
  return new Promise((ok) => c.toBlob(ok, 'image/jpeg', q))
}
async function shrink(file, o) {
  const src = await decode(file)
  const sw = src.width, sh = src.height
  let scale = Math.min(1, o.edge / Math.max(sw, sh))
  let w = Math.round(sw * scale), h = Math.round(sh * scale)
  let blob = await render(src, w, h, o.q)
  if (o.kb) {
    const limit = o.kb * 1024
    // 先降画质（二分，最低 0.5），还超就把尺寸缩一圈再来，最多缩 6 圈
    for (let round = 0; blob.size > limit && round < 7; round++) {
      let lo = 0.5, hi = o.q, best = null
      for (let i = 0; i < 5; i++) {
        const q = (lo + hi) / 2, b = await render(src, w, h, q)
        if (b.size <= limit) { best = b; lo = q } else hi = q
      }
      if (best) { blob = best; break }
      blob = await render(src, w, h, 0.5)
      if (blob.size <= limit) break
      scale *= 0.82; w = Math.round(sw * scale); h = Math.round(sh * scale)
    }
  }
  src.close?.()
  return { blob, w, h, sw, sh }
}

$('pick').onclick = () => $('file').click()
$('file').onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = ''
  const o = opts()
  for (const f of files) {
    const card = document.createElement('div'); card.className = 'card item'
    card.innerHTML = `<img alt=""><div><div class="nm">${esc(f.name)}</div><div class="sz">压着呢…</div><div class="dim"></div></div>`
    $('list').prepend(card)
    try {
      const r = await shrink(f, o)
      // 原图本来就比压完的小，就把原图还给她，不越压越大
      const keep = r.blob.size >= f.size && r.w === r.sw
      const out = keep ? f : r.blob
      const name = f.name.replace(/\.[^.]+$/, '') + (keep ? f.name.match(/\.[^.]+$/)?.[0] || '' : '-小.jpg')
      const url = URL.createObjectURL(out)
      card.querySelector('img').src = url
      card.querySelector('.sz').innerHTML = keep ? `${kb(f.size)}，已经够小了，没动` : `${kb(f.size)} → <b>${kb(out.size)}</b>（省了 ${Math.round((1 - out.size / f.size) * 100)}%）`
      card.querySelector('.dim').textContent = `${r.sw}×${r.sh} → ${keep ? r.sw : r.w}×${keep ? r.sh : r.h}` + (o.kb && out.size > o.kb * 1024 ? '　没压到目标，已经尽力了' : '')
      const acts = document.createElement('div'); acts.className = 'acts'
      acts.innerHTML = `<a href="${url}" download="${esc(name)}">保存</a>`
      const file = new File([out], name, { type: out.type || 'image/jpeg' })
      if (navigator.canShare?.({ files: [file] })) {
        const b = document.createElement('button'); b.textContent = '分享／发出去'
        b.onclick = () => navigator.share({ files: [file] }).catch(() => {})
        acts.appendChild(b)
      }
      card.appendChild(acts)
    } catch (err) {
      card.querySelector('.sz').innerHTML = '<span class="err">这张没压成，可能不是图片或者格式认不出。</span>'
    }
  }
}
</script>
</body>
</html>
