<script>
/* nest-theme-20261003: 窝里的子页面跟主应用一起换日夜。
   来源优先级: URL ?theme= / 父窗口 postMessage(显式指定) > localStorage['cn-theme'](同源共享的全局设置) > 系统 prefers-color-scheme。
   结果只写到 <html data-theme="dark|light">, 各页面自己的 CSS 只认这个属性; 另外派发 window 事件 'cn-theme' 给需要重画的页面。 */
(function(){
  var KEY='cn-theme', mq=null, forced=null;
  try{ mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)'); }catch(e){}
  try{ var q=new URLSearchParams(location.search).get('theme'); if(q==='dark'||q==='light') forced=q; }catch(e){}
  function stored(){ try{ return localStorage.getItem(KEY)||'auto'; }catch(e){ return 'auto'; } }
  function resolve(){
    var mode=forced||stored();
    if(mode!=='dark'&&mode!=='light') mode=(mq&&mq.matches)?'dark':'light';
    return mode;
  }
  function apply(){
    var m=resolve(), h=document.documentElement;
    if(h.getAttribute('data-theme')!==m) h.setAttribute('data-theme',m);
    try{ h.style.colorScheme=m; }catch(e){}
    try{ document.querySelectorAll('meta[name="theme-color"]').forEach(function(x){ x.setAttribute('content', m==='dark'?'#20201F':'#F8F8F6'); }); }catch(e){}
    try{ window.dispatchEvent(new CustomEvent('cn-theme',{detail:{mode:m}})); }catch(e){}
    return m;
  }
  window.cnTheme={apply:apply,get:resolve,isDark:function(){return resolve()==='dark'},set:function(m){forced=(m==='dark'||m==='light')?m:null;apply();}};
  apply();
  window.addEventListener('storage',function(e){ if(!e||e.key===KEY||e.key===null) apply(); });
  if(mq){ try{ mq.addEventListener('change',apply); }catch(e){ try{ mq.addListener(apply); }catch(e2){} } }
  window.addEventListener('message',function(e){
    var d=e&&e.data; if(!d||d.type!=='cn-theme') return;
    forced=(d.mode==='dark'||d.mode==='light')?d.mode:null; apply();
  });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') apply(); });
})();

</script>

try{const sp=sessionStorage.getItem('fp_span');if(SPANS.indexOf(sp)>=0)S.span=sp}catch(e){}

/* ---- 日期: 一律按 YYYY-MM-DD 字符串在 UTC 上算, 不碰本机时区 ---- */
function pd(ds){const a=ds.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function fd(t){return t.toISOString().slice(0,10)}
function addD(ds,n){const t=pd(ds);t.setUTCDate(t.getUTCDate()+n);return fd(t)}
function addM(ds,n){const t=pd(ds);return fd(new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+n,1)))}
function md(ds){const t=pd(ds);return (t.getUTCMonth()+1)+'月'+t.getUTCDate()+'日'}
const WK='一二三四五六日';
function wkd(ds){return WK[(pd(ds).getUTCDay()+6)%7]}
function roleName(){const r=S.roles.find(x=>x.id===S.role);return r?(r.name||r.id):(S.role==='kepler'?'Kepler':S.role)}

/* ---- 角色卡 ---- */
async function loadRoles(){
  S.roles=[{id:'aiyan',name:'阿言',emoji:'🐦‍⬛'}];S.role='aiyan';
  if(!S.roles.some(r=>r.id===S.role))S.roles.push({id:S.role,name:S.role,emoji:'🐾'});
  const box=$('roles');box.textContent='';
  S.roles.forEach(r=>{
    const b=el('button','rp'+(r.id===S.role?' on':''));b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',r.id===S.role?'true':'false');
    const av=el('span','av');
    if(r.avatar){const im=el('img');im.alt='';im.src=r.avatar;im.onerror=()=>{im.remove();av.textContent=r.emoji||'🐾'};av.appendChild(im)}else av.textContent=r.emoji||'🐾';
    b.appendChild(av);b.appendChild(document.createTextNode(r.name||r.id));
    b.onclick=()=>{if(S.role===r.id)return;S.role=r.id;box.querySelectorAll('.rp').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false')});load()};
    box.appendChild(b);
  });
}

/* ---- 顶上的分段和翻页 ---- */
function paintSeg(){$('seg').querySelectorAll('button').forEach(b=>{const on=b.dataset.s===S.span;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false')})}
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=b.dataset.s;if(s===S.span)return;S.span=s;try{sessionStorage.setItem('fp_span',s)}catch(e){}paintSeg();load()});
function nextStart(d){if(d.span==='day')return addD(d.date,1);if(d.span==='week')return addD(d.start,7);if(d.span==='month')return addM(d.start,1);return (Number(d.start.slice(0,4))+1)+'-01-01'}
function prevStart(d){if(d.span==='day')return addD(d.date,-1);if(d.span==='week')return addD(d.start,-7);if(d.span==='month')return addM(d.start,-1);return (Number(d.start.slice(0,4))-1)+'-01-01'}
function paintNav(d){
  $('lb').textContent=d.label||'';
  $('next').disabled=nextStart(d)>d.today;
  $('prev').disabled=!!d.first&&addD(d.start,-1)<d.first;
  $('toToday').hidden=d.start<=d.today&&d.today<=d.end;
}
$('prev').onclick=()=>{if(S.data&&!$('prev').disabled){S.date=prevStart(S.data);load()}};
$('next').onclick=()=>{if(S.data&&!$('next').disabled){S.date=nextStart(S.data);load()}};
$('toToday').onclick=()=>{S.date='';load()};
function goDay(ds){S.span='day';S.date=ds;try{sessionStorage.setItem('fp_span','day')}catch(e){}paintSeg();load();window.scrollTo({top:0,behavior:'smooth'})}

/* ---- 拉数据: 新的回来之前旧的半透明留着, 不闪白 ---- */
async function load(){
  const my=++S.seq;document.body.classList.add('loading');
  const q='/raven/footprint?role='+encodeURIComponent(S.role)+'&span='+S.span+(S.date?'&date='+S.date:'');
  try{
    const d=await api(q);if(my!==S.seq)return;
    S.data=d;S.date=d.date;paintNav(d);render(d);
  }catch(e){
    if(my!==S.seq)return;
    const m=$('main');m.textContent='';const c=el('div','card');const w=el('div','err');w.appendChild(document.createTextNode('爪印没闻到：'+(e&&e.message||'网络好像堵住了')));
    w.appendChild(el('br'));const b=el('button',null,'再闻一次');b.type='button';b.onclick=load;w.appendChild(b);c.appendChild(w);m.appendChild(c);
  }finally{if(my===S.seq)document.body.classList.remove('loading')}
}

function render(d){const m=$('main');m.textContent='';if(d.span==='day')renderDay(d,m);else renderRange(d,m)}

/* ---- 小结卡 ---- */
function dayMood(n,d){
  const who=roleName(),isToday=d.date===d.today;
  if(!n)return isToday?who+' 今天还没出门，乖乖窝着':who+' 这天窝在家里，一个爪印都没留';
  const w=isToday?'今天':'这天';
  if(n<=5)return who+' '+w+'出门溜达了几步';
  if(n<=20)return who+' '+w+'跑了不少地方';
  if(n<=50)return who+' '+w+'忙得团团转';
  return who+' '+w+'爪子都快跑冒烟了';
}
function kpi(v,lab){const k=el('div','kpi');k.appendChild(el('b',null,String(v)));k.appendChild(el('span',null,lab));return k}
function summary(d){
  const st=d.stats||{},c=el('div','card');
  if(d.span==='day'){
    const p=el('p','mood',dayMood(st.paws||0,d));
    if(st.self)p.appendChild(el('small',null,'其中 '+st.self+' 回是他自己醒来去做的'));
    c.appendChild(p);
  }else{
    const word={week:'这周',month:'这个月',year:'这一年'}[d.span];
    const p=el('p','mood',roleName()+' '+word+'留了 '+(st.paws||0)+' 个爪印');
    if(d.busiest){const sm=el('small');sm.appendChild(document.createTextNode('最忙的是 '));const b=el('button',null,md(d.busiest.d)+' 周'+wkd(d.busiest.d));b.type='button';b.onclick=()=>goDay(d.busiest.d);sm.appendChild(b);sm.appendChild(document.createTextNode('，留了 '+d.busiest.n+' 个'));p.appendChild(sm)}
    c.appendChild(p);
  }
  const ks=el('div','kpis');
  ks.appendChild(kpi(st.paws||0,'爪印'));
  if(d.span==='day')ks.appendChild(kpi(st.tools||0,'用了几样工具'));else ks.appendChild(kpi(d.active_days||0,'出门的天数'));
  ks.appendChild(kpi(st.self||0,'自己醒来'));
  ks.appendChild(kpi(st.notes||0,'记了几笔'));
  c.appendChild(ks);
  const cx=d.ctx||[];
  if(cx.length){const ch=el('div','chips');cx.forEach(x=>{const s=el('span','chip',x.emoji+' '+x.label);s.appendChild(el('b',null,String(x.n)));ch.appendChild(s)});c.appendChild(ch)}
  return c;
}
function emptyBlock(text,sub){const w=el('div','empty');w.appendChild(pawSvg());w.appendChild(document.createTextNode(text));if(sub){w.appendChild(el('br'));w.appendChild(document.createTextNode(sub))}return w}

/* ---- 日: 时间轴 ---- */
function renderDay(d,m){
  m.appendChild(summary(d));
  const eps=d.episodes||[];
  if(!eps.length){const c=el('div','card');c.appendChild(emptyBlock(d.date===d.today?'今天还没有爪印':'这天没有爪印',S.role==='lint'?'lint 在毛线球里打盹':'阿言乖乖蹲在树枝上'));m.appendChild(c);return}
  const tl=el('div','tl');
  eps.forEach((e,i)=>tl.appendChild(epNode(e,i)));
  m.appendChild(tl);
}
function epNode(e,i){
  const w=el('div','ep'+(e.kind==='self'?' self':''));w.style.setProperty('--i',Math.min(i,12));
  const rail=el('div','rail');rail.appendChild(el('div','bub',e.emoji||'🐾'));rail.appendChild(el('div','tm',e.t||''));
  const c=el('div','epc');
  const cx=el('div','ctx');cx.appendChild(el('span',null,e.ctx_emoji||''));cx.appendChild(document.createTextNode(e.ctx||''));c.appendChild(cx);
  c.appendChild(el('div','eh',e.title||''));
  const its=el('div','its');(e.items||[]).forEach(it=>its.appendChild(itemNode(it,e.title)));c.appendChild(its);
  const canGo=(e.conv&&e.mid&&parent!==window&&typeof parent.cnOpenConv==='function')||(e.kind==='night'&&parent!==window&&typeof parent.openNestPage==='function');
  if(e.say||canGo){
    const f=el('div','say');
    if(e.say){const q=el('div','q','阿言说「'+e.say+'」');f.appendChild(q)}
    if(canGo){const g=el('button','go',e.kind==='night'?'去梦境馆 ›':'去看那句 ›');g.type='button';g.dataset.motion='tiny';
      g.onclick=ev=>{ev.stopPropagation();try{if(e.kind==='night')parent.openNestPage('/nest/dream','Dream');else parent.cnOpenConv(e.conv,e.mid)}catch(x){}};f.appendChild(g)}
    c.appendChild(f);
  }
  w.appendChild(rail);w.appendChild(c);return w;
}
function itemNode(it,title){
  const li=el('div','it');
  const top=el('div','itt');top.appendChild(el('span',null,it.t||''));
  if(!it.ok)top.appendChild(el('span','fail','没成'));
  if(it.peek)top.appendChild(el('span','peek','那会儿你在用 '+it.peek));
  li.appendChild(top);
  const tx=el('div','itx');
  /* 卡片标题已经说了是什么事(或者这行是冒泡), 这行就只写内容, 不再重复动作 */
  if(it.desc&&(it.verb===title||it.name==='_bubble')){tx.appendChild(el('span',null,(it.emoji?it.emoji+' ':'')+it.desc))}
  else{tx.appendChild(el('span','iv',(it.emoji?it.emoji+' ':'')+(it.verb||'')));if(it.desc)tx.appendChild(el('span','id',' '+it.desc))}
  li.appendChild(tx);
  const det=it.detail||[];
  if(det.length||it.result){
    li.classList.add('more');li.setAttribute('role','button');li.tabIndex=0;li.dataset.motion='tiny';li.setAttribute('aria-expanded','false');
    const tog=()=>{if(!li._dt){const dt=el('div','dt');det.forEach(p=>{const r=el('div','kv');r.appendChild(el('span','k',p[0]));r.appendChild(el('span','v',p[1]));dt.appendChild(r)});
        if(it.result){const rs=el('div','res');rs.appendChild(el('b',null,'工具回他'));rs.appendChild(document.createTextNode(it.result));dt.appendChild(rs)}
        dt.onclick=ev=>ev.stopPropagation();li.appendChild(dt);li._dt=dt}
      const o=li.classList.toggle('open');li.setAttribute('aria-expanded',o?'true':'false')};
    li.onclick=tog;li.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tog()}};
  }
  return li;
}

/* ---- 周 / 月 / 年 ---- */
function lvl(n,max){if(!n)return 0;return Math.max(1,Math.min(4,Math.ceil(4*n/max)))}
function tipFor(box){let t=box.querySelector('.tip');if(!t){t=el('div','tip');box.appendChild(t)}return t}
function showTip(box,target,html){const t=tipFor(box);t.textContent='';html.forEach((s,i)=>{if(i===0)t.appendChild(el('b',null,s));else t.appendChild(document.createTextNode(s))});
  const br=box.getBoundingClientRect(),r=target.getBoundingClientRect();let x=r.left+r.width/2-br.left;const half=(t.offsetWidth||80)/2;x=Math.max(half,Math.min(br.width-half,x));
  t.style.left=x+'px';t.style.top=(r.top-br.top-6)+'px';t.classList.add('on');clearTimeout(box._tt);box._tt=setTimeout(()=>t.classList.remove('on'),1600)}
/* 柱子: 一个颜色(她的重点色), 只给最高那根标数, 按住划过去看每根, 点一下进那天 */
function columns(vals,labels,opt){
  const box=el('div','cc');const plot=el('div','plot');plot.style.height=(opt.h||120)+'px';
  const max=Math.max(1,...vals);let peak=vals.indexOf(Math.max(...vals));
  const cols=vals.map((v,i)=>{const col=el('div','col'+(opt.pick?' go-day':''));const pct=v?Math.max(2.5,v/max*100):0;col.style.setProperty('--h',pct+'%');
    if(v){const b=el('div','bar');b.style.height=pct+'%';col.appendChild(b)}
    if(v&&i===peak)col.appendChild(el('div','cap',String(v)));
    col.setAttribute('role',opt.pick?'button':'img');col.setAttribute('aria-label',opt.tip(i).join(''));col.dataset.motion='tiny';if(opt.pick)col.tabIndex=0;
    if(opt.pick){col.onclick=()=>opt.pick(i);col.onkeydown=ev=>{if(ev.key==='Enter'){opt.pick(i)}}}
    plot.appendChild(col);return col});
  const at=x=>{const r=plot.getBoundingClientRect();const i=Math.max(0,Math.min(vals.length-1,Math.floor((x-r.left)/r.width*vals.length)));return i};
  const hover=ev=>{const i=at(ev.clientX);cols.forEach((c,j)=>c.classList.toggle('hot',j===i));showTip(box,cols[i],opt.tip(i))};
  plot.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'||ev.buttons)hover(ev)});
  plot.addEventListener('pointerdown',hover);
  plot.addEventListener('pointerleave',()=>cols.forEach(c=>c.classList.remove('hot')));
  box.appendChild(plot);
  const ax=el('div','axis');labels.forEach((l,i)=>{const a=el('div',(opt.now===i?'now':''),l);ax.appendChild(a)});box.appendChild(ax);
  return box;
}
function hoursCard(d){
  const h=d.hours||[];if(!h.some(Boolean))return null;
  const c=el('div','card');const pk=h.indexOf(Math.max(...h));
  const t=el('h3',null,'几点最常出没');t.appendChild(el('span',null,'最常在 '+pk+' 点'));c.appendChild(t);
  c.appendChild(columns(h,h.map((_,i)=>i%6===0?i+'点':''),{h:76,tip:i=>[h[i]+' 个',i+' 点到 '+(i+1)+' 点']}));
  return c;
}
function catsCard(d){
  const cs=d.cats||[];if(!cs.length)return null;
  const c=el('div','card');c.appendChild(el('h3',null,'都在忙什么'));
  const max=Math.max(1,...cs.map(x=>x.n));const rk=el('div','rk');
  cs.forEach(x=>{const r=el('div','r');r.appendChild(el('div','nm',x.emoji+' '+x.label));
    const bw=el('div','bw');const b=el('div','b');b.style.width=Math.max(1.5,x.n/max*82)+'%';bw.appendChild(b);bw.appendChild(el('span','v',String(x.n)));r.appendChild(bw);
    if(x.top&&x.top.length)r.appendChild(el('div','sub',x.top.map(t=>t[0]+' '+t[1]).join(' · ')));
    rk.appendChild(r)});
  c.appendChild(rk);return c;
}
function legend(){const l=el('div','legend');l.appendChild(document.createTextNode('少'));for(let i=0;i<5;i++){const s=el('i',i?'c l'+i:null);if(!i)s.style.background='var(--h0)';l.appendChild(s)}l.appendChild(document.createTextNode('多'));return l}
function weekCard(d){
  const days=d.days||[];const c=el('div','card');
  const t=el('h3',null,'这一周的爪印');t.appendChild(el('span',null,'点柱子去那天'));c.appendChild(t);
  const vals=days.map(x=>x.n);
  c.appendChild(columns(vals,days.map(x=>'周'+wkd(x.d)+'\n'+pd(x.d).getUTCDate()),{h:118,now:days.findIndex(x=>x.d===d.today),
    tip:i=>[vals[i]+' 个',md(days[i].d)+(days[i].self?' · 自己醒来 '+days[i].self+' 回':'')],
    pick:i=>{if(days[i].d<=d.today)goDay(days[i].d)}}));
  return c;
}
function monthCard(d){
  const days=d.days||[];const c=el('div','card');
  const t=el('h3',null,'这个月的爪印');t.appendChild(el('span',null,'颜色越深爪印越多 · 👻 有自己醒来'));c.appendChild(t);
  const cal=el('div','cal');WK.split('').forEach(w=>cal.appendChild(el('div','h',w)));
  const lead=(pd(d.start).getUTCDay()+6)%7;for(let i=0;i<lead;i++)cal.appendChild(el('div','c blank'));
  const max=Math.max(1,...days.map(x=>x.n));
  days.forEach(x=>{const fut=x.d>d.today;const b=el('button','c'+(fut?' fut':' l'+lvl(x.n,max))+(x.d===d.today?' now':''));b.type='button';b.dataset.motion='tiny';
    b.appendChild(el('b',null,String(pd(x.d).getUTCDate())));b.appendChild(el('span',null,x.n?String(x.n):(fut?'':'·')));
    if(x.self)b.appendChild(el('i',null,'👻'));
    b.setAttribute('aria-label',md(x.d)+' '+x.n+' 个爪印');
    if(fut)b.disabled=true;else b.onclick=()=>goDay(x.d);
    cal.appendChild(b)});
  c.appendChild(cal);c.appendChild(legend());return c;
}
function yearCard(d){
  const days=d.days||[];const c=el('div','card');
  const t=el('h3',null,'一年的爪印');t.appendChild(el('span',null,'按住划着看 · 点一下去那天'));c.appendChild(t);
  const map={};days.forEach(x=>map[x.d]=x);const max=Math.max(1,...days.map(x=>x.n));
  const yg=el('div','yg');const y=Number(d.start.slice(0,4));const months=d.months||[];
  for(let mo=0;mo<12;mo++){
    yg.appendChild(el('div','ml',(mo+1)+'月'));
    const dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
    for(let dd=1;dd<=31;dd++){
      if(dd>dim){yg.appendChild(el('div','yc x'));continue}
      const ds=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');const x=map[ds]||{n:0,self:0};const fut=ds>d.today;
      const cell=el('div','yc'+(fut?' fut':' l'+lvl(x.n,max))+(ds===d.today?' now':''));cell.dataset.d=ds;cell.dataset.n=x.n;cell.dataset.s=x.self||0;
      yg.appendChild(cell);
    }
    yg.appendChild(el('div','mt',months[mo]?String(months[mo]):''));
  }
  const cellAt=ev=>{const e=document.elementFromPoint(ev.clientX,ev.clientY);return e&&e.classList&&e.classList.contains('yc')&&e.dataset.d?e:null};
  const box=el('div','cc');box.appendChild(yg);
  const hov=ev=>{const cl=cellAt(ev);if(cl)showTip(box,cl,[cl.dataset.n+' 个',md(cl.dataset.d)+(Number(cl.dataset.s)?' · 自己醒来 '+cl.dataset.s+' 回':'')])};
  yg.addEventListener('pointerdown',hov);yg.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'||ev.buttons)hov(ev)});
  yg.addEventListener('click',ev=>{const cl=cellAt(ev);if(cl&&cl.dataset.d<=d.today)goDay(cl.dataset.d)});
  c.appendChild(box);c.appendChild(legend());return c;
}
function renderRange(d,m){
  m.appendChild(summary(d));
  if(!(d.stats&&d.stats.paws)){const c=el('div','card');c.appendChild(emptyBlock('这段时间一个爪印都没有',S.role==='lint'?'lint 一直在毛线球里打盹':'阿言乖乖蹲在树枝上'));m.appendChild(c);return}
  m.appendChild(d.span==='week'?weekCard(d):d.span==='month'?monthCard(d):yearCard(d));
  const cc=catsCard(d);if(cc)m.appendChild(cc);
  const hc=hoursCard(d);if(hc)m.appendChild(hc);
}

window.addEventListener('message',ev=>{const x=ev.data||{};if(x.type==='nest-page-shown'){loadRoles();load()}});
paintSeg();loadRoles();load();
})();
</script>
