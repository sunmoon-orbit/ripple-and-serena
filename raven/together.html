<!-- 1020：她在推特刷到「丁达尔效应＋彩窗、光跟着陀螺仪转」的在一起天数页，想要一个。教堂换成了水底
     （名字是涟漪里来的，首页开屏也是一池水，这里就是那池水的底）。
     第二版（她看了第一版：「太平面了……光瓶子羽毛都停留在表面」「丁达尔是光的形状吗？咱们的光完全没有形状」，发了四张参考）：
     - 水调暗成深蓝，亮的只有水面一个口子和从那儿扎下来的光柱（一主两副），柱子外面是黑的
     - 光柱里挤满往下飘的亮晶晶（偶尔一颗金的），柱子外只有零星几颗
     - 光落到哪儿哪儿才亮：沙上只在光柱落地那块有光网；瓶子、羽毛、鱼进了光才被照亮，背光一侧有影子
     - 前后拉开：左下一块黑石头当前景、近处水草深而大、远处水草和鱼影淡而小；歪手机近的挪得多远的挪得少
     光柱的几何 JS 和着色器各算一份（shaft），改一边要改另一边。 -->
<style>

<script>
// 天数：和首页同一个口径（北京时间，10/10 当天算第 1 天）
const DAYS = Math.floor((Date.now() - new Date('2025-10-10T00:00:00+08:00')) / 86400000) + 1
document.getElementById('num').textContent = DAYS

// ---------- 1023：光跟着北京时间走（她：「能不能做那种根据时间改变光线明暗和颜色的变化」） ----------
// 五段：清晨（左边斜进来、粉金、细长）、白天（原来的样子）、傍晚（右边、琥珀、粗软）、入夜（退成深蓝）、深夜（月光，一根淡细柱＋萤光）。
// 关键帧之间按小时线性渐变，不会跳。rim = 东西被照到时那道亮边的颜色，所有「被光照」的颜色都按它换算。
const PAL = {
  day:   { bot: [0.004, 0.012, 0.035], top: [0.020, 0.060, 0.150], beam: [0.38, 0.62, 1.00], core: [0.85, 0.93, 1.00], surf: [0.16, 0.30, 0.60], glow: [0.62, 0.78, 1.00], up: [0.05, 0.10, 0.22], sand: [0.075, 0.090, 0.130], slit: [0.45, 0.65, 0.95], haze: [0.02, 0.05, 0.11],
           inten: 1.0, width: 1.0, side: 1.0, bias: 0.0, spark: [205, 228, 255], gold: 0.06, sparkA: 1.0, rim: [150, 195, 255], worm: 0.0, swim: 1.0 },
  dawn:  { bot: [0.010, 0.014, 0.035], top: [0.065, 0.075, 0.140], beam: [1.00, 0.76, 0.58], core: [1.00, 0.92, 0.80], surf: [0.40, 0.30, 0.40], glow: [1.00, 0.78, 0.68], up: [0.10, 0.08, 0.14], sand: [0.090, 0.085, 0.110], slit: [0.95, 0.72, 0.62], haze: [0.06, 0.05, 0.09],
           inten: 0.78, width: 0.72, side: 0.6, bias: -0.22, spark: [255, 226, 208], gold: 0.25, sparkA: 0.85, rim: [255, 200, 180], worm: 0.1, swim: 0.8 },
  dusk:  { bot: [0.018, 0.009, 0.022], top: [0.105, 0.058, 0.085], beam: [1.00, 0.58, 0.22], core: [1.00, 0.84, 0.55], surf: [0.52, 0.30, 0.18], glow: [1.00, 0.72, 0.38], up: [0.13, 0.07, 0.08], sand: [0.100, 0.070, 0.090], slit: [1.00, 0.65, 0.35], haze: [0.08, 0.03, 0.08],
           inten: 0.88, width: 1.35, side: 0.8, bias: 0.22, spark: [255, 212, 165], gold: 0.45, sparkA: 0.9, rim: [255, 180, 120], worm: 0.15, swim: 0.9 },
  fall:  { bot: [0.004, 0.008, 0.028], top: [0.020, 0.035, 0.100], beam: [0.40, 0.45, 0.85], core: [0.70, 0.75, 0.95], surf: [0.10, 0.14, 0.35], glow: [0.40, 0.45, 0.80], up: [0.03, 0.05, 0.13], sand: [0.050, 0.055, 0.090], slit: [0.40, 0.45, 0.85], haze: [0.02, 0.03, 0.08],
           inten: 0.45, width: 1.1, side: 0.3, bias: 0.15, spark: [190, 200, 255], gold: 0.05, sparkA: 0.55, rim: [140, 160, 240], worm: 0.6, swim: 0.6 },
  night: { bot: [0.002, 0.006, 0.020], top: [0.010, 0.025, 0.070], beam: [0.70, 0.80, 0.95], core: [0.90, 0.94, 1.00], surf: [0.06, 0.09, 0.20], glow: [0.55, 0.62, 0.80], up: [0.015, 0.03, 0.07], sand: [0.040, 0.045, 0.070], slit: [0.55, 0.65, 0.85], haze: [0.01, 0.02, 0.05],
           inten: 0.34, width: 0.55, side: 0.0, bias: 0.10, spark: [200, 215, 240], gold: 0.0, sparkA: 0.45, rim: [170, 190, 230], worm: 1.0, swim: 0.45 },
}
const KEYS = [[0, 'night'], [4.6, 'night'], [6.3, 'dawn'], [9, 'day'], [15.5, 'day'], [17.8, 'dusk'], [19.6, 'fall'], [22, 'night'], [24, 'night']]
const PHASE = h => h < 4.6 || h >= 22 ? '深夜' : h < 8 ? '清晨' : h < 15.5 ? '白天' : h < 19 ? '傍晚' : '入夜'
function lerpVal(a, b, k) { return Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * k) : a + (b - a) * k }
function paletteAt(h) {
  let i = 0; while (i < KEYS.length - 2 && h >= KEYS[i + 1][0]) i++
  const [h0, n0] = KEYS[i], [h1, n1] = KEYS[i + 1]
  const k = h1 > h0 ? Math.min(1, Math.max(0, (h - h0) / (h1 - h0))) : 0
  const e = k * k * (3 - 2 * k), A = PAL[n0], B = PAL[n1], out = {}
  for (const key in A) out[key] = lerpVal(A[key], B[key], e)
  return out
}
const beijingHour = () => ((Date.now() / 3600000 + 8) % 24 + 24) % 24
let hourOverride = null                 // 时间滑杆拖着的时候用它
let P = paletteAt(beijingHour())
// 被光照到的颜色：原来按白天的冷蓝写的，按 rim 和白天 rim 的比例换算（白天时原样不变）
function lc(r, g, b, a) {
  const f = P.rim
  return `rgba(${Math.min(255, r * f[0] / 150) | 0},${Math.min(255, g * f[1] / 195) | 0},${Math.min(255, b * f[2] / 255) | 0},${a})`
}

// ---------- 光柱几何（JS 版，和着色器里的 shaft() 一致） ----------
// 坐标：P = (x*aspect, y)，y 向上，0 在底 1 在顶。光从水面上的口子 A 往 D 方向扎下去，越往下越宽、越淡。
const FLOOR = x => 0.13 + 0.018 * Math.sin(x * 3.1 + 0.4) + 0.009 * Math.sin(x * 8.3 + 1.7)
// 第五版（1021 她：「左右移动的时候，光是成柱体随着移动的，这不符合正常光线照射的逻辑」）：
// 太阳换角度时，水面上光进来的那个口子基本不挪（只挪一点点），光柱是绕着口子「转」，落到沙上的那块才跑得远。
const apexX = sun => 0.5 + (sun - 0.5) * 0.12
const leanOf = sun => -(sun - 0.5) * 1.35
function beams(sun, a) {
  const lean = leanOf(sun), ax = apexX(sun)
  const D = norm([lean, -1])
  const wm = P.width, I = P.inten, sd = P.side   // 1023：粗细、亮度、两根副光柱留多少都跟着时间
  return [
    { A: [ax * a, 1.03], D, w0: 0.055 * wm, k: 0.20 * wm, s: 1.0 * I },
    { A: [(ax - 0.30) * a, 1.03], D: norm([lean * 1.15 - 0.05, -1]), w0: 0.025 * wm, k: 0.11 * wm, s: 0.38 * I * sd },
    { A: [(ax + 0.27) * a, 1.03], D: norm([lean * 0.85 + 0.06, -1]), w0: 0.02 * wm, k: 0.10 * wm, s: 0.30 * I * sd },
  ]
}
function norm(v) { const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l] }
function sstep(e0, e1, x) { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t) }
function shaftAt(px, py, b) {
  const rx = px - b.A[0], ry = py - b.A[1]
  const s = rx * b.D[0] + ry * b.D[1], pp = rx * -b.D[1] + ry * b.D[0]
  const w = b.w0 + Math.max(0, s) * b.k
  return sstep(w, w * 0.25, Math.abs(pp)) * sstep(0, 0.05, s) * Math.exp(-s * 0.85) * b.s
}
function lightAt(x, y, B, a) { let l = 0; for (const b of B) l += shaftAt(x * a, y, b); return Math.min(1.2, l) }

// ---------- 光：WebGL ----------
const glc = document.getElementById('gl')
const gl = glc.getContext('webgl', { antialias: false, premultipliedAlpha: false })
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`
const FS = `
precision highp float;
uniform vec2 R; uniform float T; uniform float SUN; uniform float BX; uniform float BL;
uniform vec3 C_BOT, C_TOP, C_BEAM, C_CORE, C_SURF, C_GLOW, C_UP, C_SAND, C_SLIT, C_HAZE;
uniform float INT, WM, SIDE;
float floorY(float x){ return 0.13 + 0.018*sin(x*3.1+0.4) + 0.009*sin(x*8.3+1.7); }
float h1(float n){ return fract(sin(n)*43758.5453); }
float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h1(i), h1(i+1.), f); }
float caustic(vec2 uv, float t){
  vec2 p = mod(uv*6.2831, 6.2831) - 250.0;
  vec2 i = p; float c = 1.0; float inten = .005;
  for (int n=0; n<4; n++){
    float tt = t*(1.0-(3.5/float(n+1)));
    i = p + vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c += 1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0., 1.);
}
// 一根光柱：亮度＋柱内一条条细纹
float shaft(vec2 P, vec2 A, vec2 D, float w0, float k, float t, out float streak){
  vec2 r = P - A; float s = dot(r, D); float pp = dot(r, vec2(-D.y, D.x));
  float w = w0 + max(s, 0.)*k;
  float m = smoothstep(w, w*0.25, abs(pp)) * smoothstep(0., 0.05, s) * exp(-s*0.85);
  streak = 0.55 + 0.75*n1(pp/w*7.0 + t*0.25) * n1(pp/w*3.0 - t*0.17 + 9.0);
  return m;
}
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float a = R.x / R.y;
  vec2 P = vec2(uv.x*a, uv.y);
  float t = T;
  // 深水：几乎黑的藏青，越往上越带一点蓝
  vec3 col = mix(C_BOT, C_TOP, smoothstep(0.05, 1.0, uv.y));
  // 三根光柱
  float lean = -(SUN - 0.5)*1.35;
  float AX = 0.5 + (SUN - 0.5)*0.12;   // 光口只挪一点，光柱绕着它转（跟 JS 的 apexX/leanOf 一致）
  vec2 D0 = normalize(vec2(lean, -1.)), D1 = normalize(vec2(lean*1.15 - 0.05, -1.)), D2 = normalize(vec2(lean*0.85 + 0.06, -1.));
  float st0, st1, st2;
  float b0 = shaft(P, vec2(AX*a, 1.03), D0, 0.055*WM, 0.20*WM, t, st0);
  float b1 = shaft(P, vec2((AX-0.30)*a, 1.03), D1, 0.025*WM, 0.11*WM, t+3., st1) * 0.38 * SIDE;
  float b2 = shaft(P, vec2((AX+0.27)*a, 1.03), D2, 0.02*WM, 0.10*WM, t+7., st2) * 0.30 * SIDE;
  float fy = floorY(uv.x);
  float above = smoothstep(fy - 0.01, fy + 0.04, uv.y);
  float beam = (b0*st0 + b1*st1 + b2*st2) * above;
  col += C_BEAM * beam * 0.62 * INT;
  col += C_CORE * b0*b0*b0 * 0.30 * above * INT;   // 主光柱芯子发白
  // 水面：大部分是暗的波纹，只有光口那一块亮成一团
  // 1020 她：「顶上就好像只有中间那一块……太突兀」——水面整条都该有晃动的亮，离太阳越远越淡，光口本身更宽更软
  float surf = smoothstep(0.80, 1.0, uv.y);
  float sc = caustic(vec2(uv.x*a*1.4 + SUN*0.5, uv.y*4.0), t*0.5);
  float sc2 = caustic(vec2(uv.x*a*0.7 - SUN*0.3 + 3.0, uv.y*2.5), t*0.37);
  float near = exp(-abs(uv.x - AX)*a*1.6);
  col += C_SURF * surf * (0.16 + 0.22*near) * (0.6 + sc*0.9 + sc2*0.5);
  vec2 hole = vec2((uv.x - AX)*a*0.55, (uv.y - 1.0)*2.0);
  float glow = exp(-dot(hole, hole)*14.0);
  col += C_GLOW * glow * (0.55 + sc*0.45) * (0.4 + 0.6*INT);
  col += C_UP * smoothstep(0.6, 1.0, uv.y);   // 整个上半截稍亮一点，不让光口孤零零的
  // 沙地：本身很暗；光柱落地的那一块才有光网
  if (uv.y < fy) {
    float sd = (fy - uv.y) / fy;
    vec3 sand = mix(C_SAND, C_SAND*0.25, sd);
    sand *= 0.85 + 0.15*n1(uv.x*a*90.0 + uv.y*40.0);
    float yy = fy + 0.01;
    float s0, s1, s2;
    float lit = shaft(vec2(P.x, yy), vec2(AX*a, 1.03), D0, 0.055*WM, 0.20*WM, t, s0)
              + 0.38*SIDE*shaft(vec2(P.x, yy), vec2((AX-0.30)*a, 1.03), D1, 0.025*WM, 0.11*WM, t, s1)
              + 0.30*SIDE*shaft(vec2(P.x, yy), vec2((AX+0.27)*a, 1.03), D2, 0.02*WM, 0.10*WM, t, s2);
    lit *= 2.6 * INT;
    vec2 cu = vec2(uv.x*a*(1.8 + sd*0.8) + (SUN-0.5)*0.9, (fy - uv.y)*(3.6 + sd*1.5));
    float c = caustic(cu, t*0.55);
    sand += C_SLIT * lit * (0.25 + c*1.1) * (1.0 - sd*0.6);
    // 瓶子透下来的彩斑：只在瓶子被光照到时出现，落在背光一侧
    // 1021 她：「光打在玻璃瓶上没反应」——瓶子像透镜，把光聚到它背后（顺着光柱斜下去的方向）的沙上：
    // 一条亮得发白的焦散细线＋一圈淡的，跟着光微微抖
    float sx = BX + lean*0.06;
    vec2 q = vec2((uv.x - sx)*a/0.07, (uv.y - (floorY(BX) - 0.028))/0.016);
    float wob = 0.85 + 0.15*sin(t*2.3 + q.x*3.0);
    float core = exp(-(q.x*1.6)*(q.x*1.6) - (q.y*2.4)*(q.y*2.4));   // 别用 pow：底数为负在有的手机 GPU 上是 NaN
    float halo = exp(-dot(q, q)*0.45);
    sand += mix(C_CORE, vec3(1.0), 0.3) * core * BL * 1.4 * wob + C_SLIT * 0.7 * halo * BL * 0.35;
    col = mix(col, sand, smoothstep(0.0, 0.006, fy - uv.y));
  }
  // 远处一层薄雾：靠中下方，给前后拉开一点距离
  col += C_HAZE * exp(-((uv.y - 0.35)*3.0)*((uv.y - 0.35)*3.0)) * 0.6;
  vec2 v = uv - vec2(0.5, 0.55); col *= 1.0 - dot(v, v)*0.9;
  gl_FragColor = vec4(col, 1.0);
}`

let U = {}, glOK = false
try {
  if (!gl) throw new Error('no webgl')
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s }
  const prog = gl.createProgram()
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS))
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog))
  gl.useProgram(prog)
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
  for (const k of ['R', 'T', 'SUN', 'BX', 'BL', 'C_BOT', 'C_TOP', 'C_BEAM', 'C_CORE', 'C_SURF', 'C_GLOW', 'C_UP', 'C_SAND', 'C_SLIT', 'C_HAZE', 'INT', 'WM', 'SIDE']) U[k] = gl.getUniformLocation(prog, k)
  glOK = true

{

// 鱼群（1021 她发来一个「鱼群顺着光往上游、越往上越淡」的开屏）。
// 第二版（她：「好像少了点啥」——第一版一条条均匀撒满全程、个个直挺挺朝上，像往上飘的雨点）：
// 一百五十条挤成一条有头有尾的鱼带，整条一起沿主光柱绕着往上游（中间密、两头稀、中段宽）；
// 大小分远近；隔一阵整群拐个弯，从鱼头到鱼尾依次侧身，银光一闪。游到水面附近淡掉，歇一会儿从底下再来一群。
const SCHOOL = Array.from({ length: 150 }, () => {
  const rel = (Math.random() + Math.random()) / 2                // 在鱼带里的位置：0 尾 → 1 头，中间多
  return { rel, off: (Math.random() + Math.random() + Math.random() - 1.5) / 1.5, z: Math.random(), ph: Math.random() * 6.28, jit: Math.random() * 0.02 }

const BAND = 0.38                                                 // 鱼带有多长（沿路径）
function schoolPos(u, off, t, b) {

    const [x1, y1] = schoolPos(u, off, t, b)
    const fade = Math.min(1, u / 0.08) * (1 - sstep(0.62, 1.0, u))
    if (fade < 0.02) continue
    const L = Math.min(1, lightAt(x1, y1, B, AS) * 1.5)
    // 拐弯：从头到尾依次侧身、闪一下
    const dtTurn = t - school.turnAt - (1 - f.rel) * 0.9
    const flash = Math.exp(-dtTurn * dtTurn * 10)
    const ang = Math.atan2(-(y1 - y0) * H, (x1 - x0) * W) + flash * 0.6 * Math.sin(f.ph)
    const len = Math.min(W, H) * 0.02 * (0.55 + f.z * 0.9)
    const a = fade * (0.25 + 0.75 * f.z) * (0.35 + L * 0.55 + flash * 0.5)
    const lum = Math.min(1, L * 0.8 + flash * 0.7)
    ctx.save(); ctx.translate(X(x1), Y(y1)); ctx.rotate(ang)
    const wag = Math.sin(t * 10 + f.ph) * len * 0.12
    ctx.fillStyle = `rgba(${(140 + lum * 110) | 0},${(165 + lum * 88) | 0},${(195 + lum * 60) | 0},${Math.min(1, a).toFixed(3)})`
    ctx.beginPath(); ctx.ellipse(0, 0, len * 0.5, len * (0.15 + flash * 0.13), 0, 0, Math.PI * 2); ctx.fill()
    ctx.beginPath(); ctx.moveTo(-len * 0.42, 0); ctx.lineTo(-len * 0.72, -len * 0.15 + wag); ctx.lineTo(-len * 0.72, len * 0.15 + wag); ctx.closePath(); ctx.fill()
    ctx.restore()
  }
}

// 小螃蟹：昨天彩蛋里那只 Clawd（橘色方块身子、两只小眼、四对腿、两只钳子）。
// 隔一阵从一边横着走过沙地；走到瓶子跟前停下来拿钳子戳两下再走。进光就亮，平时被深水压成暗橘。
const crab = { x: -0.1, dir: 1, wait: 4, poke: 0, poked: false, step: 0 }
function stepCrab(dt) {
  const c = crab
  if (c.wait > 0) { c.wait -= dt; return }
  if (c.poke > 0) { c.poke -= dt; return }
  c.x += 0.028 * c.dir * dt; c.step += dt
  if (!c.poked && Math.abs(c.x - (BX - 0.13 * c.dir)) < 0.01) { c.poke = 2.4; c.poked = true }
  if (c.x > 1.1 || c.x < -0.1) Object.assign(c, { dir: -c.dir, wait: 18 + Math.random() * 20, poked: false })
}
function drawCrab(t, B) {
  const c = crab; if (c.wait > 0) return
  const s = Math.max(2, Math.round(Math.min(W, H) * 0.0085))   // 一个像素块多大
  const lit = Math.min(1, lightAt(c.x, FLOOR(c.x) + 0.01, B, AS) * 1.8)
  const mix = (a, b) => Math.round(a + (b - a) * (0.35 + lit * 0.65))
  const O = `rgb(${mix(60, 217)},${mix(30, 119)},${mix(28, 87)})`, E = 'rgb(20,12,10)'
  const leg = Math.floor(c.step * 6) % 2, pk = c.poke > 0 ? Math.floor(c.poke * 5) % 2 : 0
  // 9×6 的小像素：身子 7 宽 3 高，两边钳子，下面腿
  const px = Math.round(X(c.x) - 4.5 * s), py = Math.round(Y(FLOOR(c.x) - 0.035) - 6 * s)   // 走在瓶子前面一点（离你更近），不压在瓶子上
  const dot = (gx, gy, col) => { ctx.fillStyle = col; ctx.fillRect(px + gx * s, py + gy * s, s, s) }
  for (let gx = 1; gx <= 7; gx++) for (let gy = 1; gy <= 3; gy++) dot(gx, gy, O)
  dot(3, 1, E); dot(5, 1, E)                                   // 眼睛
  const cl = c.dir > 0 ? 8 : 0, cr = c.dir > 0 ? 0 : 8           // 朝走的方向那只钳子戳瓶子
  dot(cl, 2 - pk, O); dot(cl, 1 - pk, O); dot(cr, 2, O)
  // 腿贴着身子长（1021 她：「腿好像是断的」——原来抬起的那条只画在第 5 行，跟身子隔了一格）：都从第 4 行起，踩地的那几条再往下多一格
  for (const gx of [2, 4, 5, 7]) { dot(gx, 4, O); if ((gx + leg) % 2) dot(gx, 5, O) }
  // 沙上一小块影子
  ctx.fillStyle = 'rgba(0,0,8,.35)'; ctx.fillRect(px + s, py + 6 * s, 7 * s, Math.max(1, s * 0.5))
}

// 沙上的小东西：贝壳、石子、海星。y 越低越近、越大；光网扫过时贝壳闪一下
const STUFF = [
  { k: 'pebble', x: 0.44, d: 0.35 }, { k: 'pebble', x: 0.48, d: 0.3 }, { k: 'shell', x: 0.55, d: 0.75 },
  { k: 'star', x: 0.79, d: 0.9 }, { k: 'pebble', x: 0.85, d: 0.7 }, { k: 'shell', x: 0.92, d: 0.45 },
  { k: 'pebble', x: 0.56, d: 0.35 }, { k: 'shell', x: 0.70, d: 0.3 },
]
function drawStuff(t, B) {
  for (const o of STUFF) {
    const fy = FLOOR(o.x), yy = fy - o.d * fy * 0.55          // 沙面往下，越往下越近
    const sz = Math.min(W, H) * (0.012 + o.d * 0.022)
    const x = X(o.x), y = Y(yy)
    const lit = Math.min(1, lightAt(o.x, fy + 0.01, B, AS) * 2.2)
    const tw = 0.5 + 0.5 * Math.sin(t * 2.2 + o.x * 40)
    const v = (a, b) => Math.round(a + (b - a) * lit)
    ctx.save(); ctx.translate(x, y)
    ctx.fillStyle = 'rgba(0,0,8,.3)'; ctx.beginPath(); ctx.ellipse(sz * 0.15, sz * 0.35, sz * 0.9, sz * 0.22, 0, 0, Math.PI * 2); ctx.fill()
    if (o.k === 'pebble') {
      const g = ctx.createRadialGradient(-sz * 0.3, -sz * 0.3, 0, 0, 0, sz)
      g.addColorStop(0, `rgb(${v(40, 120)},${v(48, 140)},${v(66, 170)})`); g.addColorStop(1, `rgb(${v(10, 40)},${v(14, 50)},${v(24, 70)})`)
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.8, sz * 0.5, 0.2, 0, Math.PI * 2); ctx.fill()
    } else if (o.k === 'shell') {
      ctx.fillStyle = `rgb(${v(60, 220)},${v(58, 200)},${v(70, 210)})`
      ctx.beginPath(); ctx.moveTo(0, sz * 0.4)
      for (let i = 0; i <= 8; i++) { const a = Math.PI * (1.05 + i / 8 * 0.9); ctx.lineTo(Math.cos(a) * sz * (i % 2 ? 0.75 : 0.85), Math.sin(a) * sz * 0.8 + sz * 0.2) }
      ctx.closePath(); ctx.fill()
      ctx.strokeStyle = `rgba(0,0,10,.35)`; ctx.lineWidth = 0.8
      for (let i = 1; i < 5; i++) { const a = Math.PI * (1.1 + i / 5 * 0.8); ctx.beginPath(); ctx.moveTo(0, sz * 0.4); ctx.lineTo(Math.cos(a) * sz * 0.7, Math.sin(a) * sz * 0.7 + sz * 0.2); ctx.stroke() }
      if (lit > 0.2) {   // 贝壳的珠光闪一下
        ctx.globalCompositeOperation = 'lighter'
        const gg = ctx.createRadialGradient(-sz * 0.2, -sz * 0.2, 0, -sz * 0.2, -sz * 0.2, sz * 0.9)
        gg.addColorStop(0, `${lc(230, 240, 255, (lit * tw * 0.7).toFixed(3))}`); gg.addColorStop(1, 'rgba(230,240,255,0)')
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(-sz * 0.2, -sz * 0.2, sz * 0.9, 0, Math.PI * 2); ctx.fill()
        ctx.globalCompositeOperation = 'source-over'
      }
    } else {
      ctx.fillStyle = `rgb(${v(70, 210)},${v(30, 100)},${v(40, 90)})`
      ctx.beginPath()
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? sz * 0.35 : sz; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.55) }
      ctx.closePath(); ctx.fill()
    }
    ctx.restore()
  }
}

// 贴着沙面飘的细沙：很淡，光里亮一点；偶尔从沙里冒一串小泡
const silt = Array.from({ length: 70 }, () => ({ x: Math.random(), h: Math.random() * 0.045, v: (Math.random() - 0.5) * 0.01, ph: Math.random() * 6 }))
function drawSilt(t, dt, B) {
  for (const p of silt) {
    p.x += p.v * dt; if (p.x < 0) p.x += 1; if (p.x > 1) p.x -= 1
    const yy = FLOOR(p.x) + p.h + Math.sin(t * 0.5 + p.ph) * 0.004
    const L = lightAt(p.x, yy, B, AS)
    ctx.fillStyle = `${lc(180, 200, 230, (0.06 + L * 0.4).toFixed(3))}`
    ctx.fillRect(X(p.x), Y(yy), 1.4, 1.4)
  }
}

// 远处礁石剪影：比左下那块淡，挪得少，拉出纵深
function drawReefs(par) {
  ctx.save(); ctx.translate(par * 12, 0)
  ctx.fillStyle = 'rgba(6,16,36,.75)'
  ctx.beginPath(); ctx.moveTo(W * 0.52, Y(FLOOR(0.6)) + 4)
  ctx.bezierCurveTo(W * 0.56, Y(FLOOR(0.6) + 0.07), W * 0.64, Y(FLOOR(0.6) + 0.09), W * 0.70, Y(FLOOR(0.7) + 0.05))
  ctx.bezierCurveTo(W * 0.74, Y(FLOOR(0.72) + 0.03), W * 0.78, Y(FLOOR(0.78) + 0.02), W * 0.80, Y(FLOOR(0.8)) + 4)
  ctx.closePath(); ctx.fill()
  ctx.fillStyle = 'rgba(8,20,44,.6)'
  ctx.beginPath(); ctx.moveTo(W * 0.18, Y(FLOOR(0.2)) + 4)
  ctx.bezierCurveTo(W * 0.22, Y(FLOOR(0.22) + 0.05), W * 0.3, Y(FLOOR(0.28) + 0.06), W * 0.34, Y(FLOOR(0.34)) + 4)
  ctx.closePath(); ctx.fill()
  ctx.restore()
}

// 亮晶晶：大多数生在光柱里、慢慢往下飘；柱子外面也有，但暗得几乎看不见
const SPARK_N = 320
const sparks = Array.from({ length: SPARK_N }, () => spawnSpark({}, true))
function spawnSpark(p, anyY) {
  p.x = Math.random(); p.y = anyY ? 0.1 + Math.random() * 0.92 : 1.0 + Math.random() * 0.05
  p.r = Math.random() < 0.1 ? 1.1 + Math.random() * 0.8 : 0.35 + Math.random() * 0.7   // 1020 她：光点还是太大
  p.v = 0.006 + Math.random() * 0.018; p.ph = Math.random() * 6.28; p.gr = Math.random()   // gr < P.gold 的是金的（傍晚多、深夜没有）
  return p
}
let B0 = beams(0.5, AS)
function placeInBeam(p) {
  // 让一大半的颗粒落在主光柱里：沿着光柱随机取一点
  const b = B0[Math.random() < 0.8 ? 0 : 1 + (Math.random() < 0.5 ? 1 : 0)]
  const s = Math.random() * 1.0, w = b.w0 + s * b.k
  const pp = (Math.random() + Math.random() - 1) * w
  const px = b.A[0] + b.D[0] * s - b.D[1] * pp, py = b.A[1] + b.D[1] * s + b.D[0] * pp
  p.x = px / AS; p.y = py
}
for (const p of sparks) if (Math.random() < 0.7) placeInBeam(p)
function drawSparks(t, dt, B) {
  ctx.globalCompositeOperation = 'lighter'
  for (const p of sparks) {
    p.y -= p.v * dt; p.x += Math.sin(t * 0.4 + p.ph) * 0.0008
    if (p.y < FLOOR(p.x) + 0.01 || p.x < -0.05 || p.x > 1.05) { spawnSpark(p, false); if (Math.random() < 0.75) placeInBeam(p) }
    const L = lightAt(p.x, p.y, B, AS)
    const tw = 0.55 + 0.45 * Math.sin(t * (1.5 + p.r) + p.ph * 3)
    const a = (0.04 + L * 0.95) * tw * P.sparkA
    if (a < 0.02) continue
    const x = X(p.x), y = Y(p.y)
    const gold = p.gr < P.gold, sc = P.spark
    ctx.fillStyle = gold ? `rgba(255,214,150,${a.toFixed(3)})` : `rgba(${sc[0] | 0},${sc[1] | 0},${sc[2] | 0},${a.toFixed(3)})`
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill()
    if (p.r > 1.1 && L > 0.3) {  // 大颗的带一点光晕和十字闪；光晕要中间亮往外散（1020 第二版画成实心圆，她看成「套了一圈小圆圈」）
      const hr = p.r * 2.6
      const hg = ctx.createRadialGradient(x, y, 0, x, y, hr)
      const c = gold ? '255,205,140' : `${(sc[0] * 0.83) | 0},${(sc[1] * 0.9) | 0},${sc[2] | 0}`
      hg.addColorStop(0, `rgba(${c},${(a * 0.35).toFixed(3)})`); hg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y, hr, 0, Math.PI * 2); ctx.fill()
      const sl = p.r * 3.5 * tw
      const lg = ctx.createLinearGradient(x - sl, y, x + sl, y)
      lg.addColorStop(0, `rgba(${c},0)`); lg.addColorStop(.5, `rgba(${c},${(a * 0.5).toFixed(3)})`); lg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = lg; ctx.fillRect(x - sl, y - 0.35, sl * 2, 0.7)
      const vg = ctx.createLinearGradient(x, y - sl, x, y + sl)
      vg.addColorStop(0, `rgba(${c},0)`); vg.addColorStop(.5, `rgba(${c},${(a * 0.5).toFixed(3)})`); vg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = vg; ctx.fillRect(x - 0.35, y - sl, 0.7, sl * 2)
    }
  }
  ctx.globalCompositeOperation = 'source-over'
}

// 气泡：偶尔从水草根和瓶口冒
const bubbles = []
function stepBubbles(dt) {
  if (Math.random() < dt * 0.4) {
    const r = Math.random()
    const src = r < 0.4 ? weeds[3 + Math.floor(Math.random() * 3)].x : r < 0.6 ? BX + 0.09 : 0.3 + Math.random() * 0.5   // 后面那段：从沙里冒
    bubbles.push({ x: src, y: FLOOR(src) + 0.02, r: 1.5 + Math.random() * 3, ph: Math.random() * 6 })
  }
  for (const b of bubbles) { b.y += dt * (0.03 + b.r * 0.006); b.ph += dt * 3 }
  while (bubbles.length && bubbles[0].y > 0.97) bubbles.shift()
}
function drawBubbles(B) {
  for (const b of bubbles) {
    const L = lightAt(b.x, b.y, B, AS)
    const x = X(b.x) + Math.sin(b.ph) * 3, y = Y(b.y)
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2)
    ctx.strokeStyle = `${lc(200, 225, 255, (0.18 + L * 0.6).toFixed(2))}`; ctx.lineWidth = 1; ctx.stroke()
  }
}

// 萤光浮游（1023）：入夜以后才有，蓝绿色小点慢慢漂、一明一暗，水底不会死黑
const worms = Array.from({ length: 70 }, () => ({ x: Math.random(), y: 0.12 + Math.random() * 0.8, vx: (Math.random() - 0.5) * 0.006, vy: (Math.random() - 0.5) * 0.004, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 1.2, r: 0.6 + Math.random() * 1.2 }))
function drawWorms(t, dt, par) {
  if (P.worm < 0.02) return
  ctx.globalCompositeOperation = 'lighter'
  for (const w of worms) {
    w.x += w.vx * dt; w.y += w.vy * dt + Math.sin(t * 0.3 + w.ph) * 0.0004
    if (w.x < -0.02) w.x = 1.02; if (w.x > 1.02) w.x = -0.02
    if (w.y < FLOOR(w.x) + 0.01 || w.y > 0.95) w.vy = -w.vy
    const pulse = Math.max(0, Math.sin(t * w.sp + w.ph)) ** 3
    const a = P.worm * (0.08 + pulse * 0.75)
    if (a < 0.02) continue
    const x = X(w.x) + par * 8 * w.r, y = Y(w.y), hr = w.r * 5
    const g = ctx.createRadialGradient(x, y, 0, x, y, hr)
    g.addColorStop(0, `rgba(120,255,215,${(a * 0.5).toFixed(3)})`); g.addColorStop(1, 'rgba(60,200,190,0)')
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, hr, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = `rgba(190,255,235,${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, w.r * 0.8, 0, Math.PI * 2); ctx.fill()
  }
  ctx.globalCompositeOperation = 'source-over'
}

// 时间滑杆（1023，给她验收用）：长按屏幕四个角任意一个，拖着看一天的光；点「回到现在」收起
const tbar = document.getElementById('tbar'), trange = document.getElementById('trange'), tlabel = document.getElementById('tlabel')
function showLabel(h) { tlabel.textContent = `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor(h % 1 * 60)).padStart(2, '0')} · ${PHASE(h)}` }
let pressT = null
addEventListener('pointerdown', e => {
  if (tbar.contains(e.target)) return
  const corner = (e.clientX < 90 || e.clientX > W - 90) && (e.clientY < 120 || e.clientY > H - 120)
  if (!corner) return
  pressT = setTimeout(() => {
    hourOverride = beijingHour(); trange.value = hourOverride; showLabel(hourOverride)
    tbar.classList.add('on'); try { navigator.vibrate?.(15) } catch {}
  }, 600)
})
addEventListener('pointerup', () => clearTimeout(pressT)); addEventListener('pointercancel', () => clearTimeout(pressT))
trange.addEventListener('input', () => { hourOverride = +trange.value; showLabel(hourOverride) })
document.getElementById('tnow').addEventListener('click', () => { hourOverride = null; tbar.classList.remove('on') })
// 页面里开着 ?h=18.5 也能直接看某个时刻（截图验收用）
{ const q = new URLSearchParams(location.search).get('h'); if (q != null && !isNaN(+q)) hourOverride = ((+q % 24) + 24) % 24 }

// ---------- 歪手机 ----------
let target = 0.5, sun = 0.5, tilted = false
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return
  target = 0.5 + Math.max(-1, Math.min(1, e.gamma / 40)) * 0.40
  if (Math.abs(e.gamma) > 6 && !tilted) { tilted = true; document.getElementById('hint').style.opacity = 0 }
})
addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) target = 0.1 + 0.8 * (e.clientX / W) })
setTimeout(() => { document.getElementById('hint').style.opacity = 0 }, 6000)

const numEl = document.getElementById('num')
let last = performance.now(), t0 = last, running = true
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame) } })
function frame(now) {
  if (!running) return
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  const t = (now - t0) / 1000
  sun += (target - sun) * Math.min(1, dt * 3)
  const par = (sun - 0.5) * 2          // -1..1，视差用（只跟手机歪多少有关）
  P = paletteAt(hourOverride ?? beijingHour())
  const sunL = Math.max(0, Math.min(1, sun + P.bias))   // 光从哪边来：清晨偏左、傍晚偏右，歪手机在这上面再加
  const B = beams(sunL, AS); B0 = B; B_now = B; sunNow = sunL
  const BL = Math.min(1, lightAt(BX, FLOOR(BX) + 0.03, B, AS) * 1.6)
  if (glOK) {
    gl.uniform2f(U.R, glc.width, glc.height); gl.uniform1f(U.T, t)
    gl.uniform1f(U.SUN, sunL); gl.uniform1f(U.BX, BX); gl.uniform1f(U.BL, BL)
    for (const k of ['bot', 'top', 'beam', 'core', 'surf', 'glow', 'up', 'sand', 'slit', 'haze']) gl.uniform3fv(U['C_' + k.toUpperCase()], P[k])
    gl.uniform1f(U.INT, P.inten); gl.uniform1f(U.WM, P.width); gl.uniform1f(U.SIDE, P.side)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }
  ctx.clearRect(0, 0, W, H)
  drawReefs(par)
  for (const w of weeds) if (w.depth === 1) drawWeed(w, t, par)       // 远处
  for (const f of fish) drawFish(f, t, dt, B, par)
  drawSparks(t, dt, B)
  drawWorms(t, dt, par)
  drawSchool(t, dt, B)
  drawSilt(t, dt, B)
  drawStuff(t, B)
  drawBottle(t, B, sunL, par)
  stepCrab(dt); drawCrab(t, B)
  stepNearFish(dt, t); drawNearFish(t, B)
  stepBubbles(dt); drawBubbles(B)
  for (const w of weeds) if (w.depth < 1) drawWeed(w, t, par)         // 近处
  drawRock(par, B)
  // 数字：被光柱扫到时亮
  const L = Math.min(1, lightAt(0.5, 0.72, B, AS) * 1.4)
  const g = 0.25 + L * 0.75
  numEl.style.textShadow = `0 0 ${(14 + g * 34).toFixed(1)}px ${lc(160, 200, 255, (0.15 + g * 0.5).toFixed(3))}, 0 2px 14px rgba(0,5,20,.6)`
  numEl.style.opacity = (0.72 + g * 0.28).toFixed(3)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
