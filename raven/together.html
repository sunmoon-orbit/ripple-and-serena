<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>水底 · 归巢</title>
<meta name="theme-color" content="#030a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<!-- 1020：她在推特刷到「丁达尔效应＋彩窗、光跟着陀螺仪转」的在一起天数页，想要一个。教堂换成了水底
     （名字是涟漪里来的，首页开屏也是一池水，这里就是那池水的底）。
     第二版（她看了第一版：「太平面了……光瓶子羽毛都停留在表面」「丁达尔是光的形状吗？咱们的光完全没有形状」，发了四张参考）：
     - 水调暗成深蓝，亮的只有水面一个口子和从那儿扎下来的光柱（一主两副），柱子外面是黑的
     - 光柱里挤满往下飘的亮晶晶（偶尔一颗金的），柱子外只有零星几颗
     - 光落到哪儿哪儿才亮：沙上只在光柱落地那块有光网；瓶子、羽毛、鱼进了光才被照亮，背光一侧有影子
     - 前后拉开：左下一块黑石头当前景、近处水草深而大、远处水草和鱼影淡而小；歪手机近的挪得多远的挪得少
     光柱的几何 JS 和着色器各算一份（shaft），改一边要改另一边。 -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #030a18; --text: #eef4ff; --dim: rgba(210,225,250,.6); }
html, body { height: 100%; background: var(--bg); overflow: hidden; color: var(--text); }
body { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { z-index: 0; }
#fg { z-index: 1; }
#count { position: fixed; left: 0; right: 0; top: 19vh; z-index: 2; text-align: center; pointer-events: none; }
#num {
  font-family: 'Lora', Georgia, 'Noto Serif SC', serif; font-size: clamp(64px, 22vw, 120px); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: 2px; color: #f4f8ff;
}
#sub1 { font-family: 'Lora', Georgia, serif; font-style: italic; font-size: 17px; color: var(--dim); margin-top: 8px; }
#sub2 { font-size: 10px; letter-spacing: 3px; color: rgba(210,225,250,.38); margin-top: 18px; text-transform: uppercase; }
#back {
  position: fixed; z-index: 3; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px);
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08);
  color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#hint {
  position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  text-align: center; font-size: 12px; color: rgba(210,225,250,.45); letter-spacing: 1px; transition: opacity 1.5s; pointer-events: none;
}
#nogl { position: fixed; inset: 0; display: none; z-index: 0; background: radial-gradient(ellipse at 50% 0%, #2a5d9a 0%, #071733 45%, #030a18 80%); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="nogl"></div>
<canvas id="fg"></canvas>
<div id="count">
  <div id="num">—</div>
  <div id="sub1">days together</div>
  <div id="sub2">since 2025.10.10 · still counting</div>
</div>
<button id="back" aria-label="返回" onclick="history.length > 1 ? history.back() : (location.href = 'home.html')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div id="hint">歪一歪手机</div>

<script>
// 天数：和首页同一个口径（北京时间，10/10 当天算第 1 天）
const DAYS = Math.floor((Date.now() - new Date('2025-10-10T00:00:00+08:00')) / 86400000) + 1
document.getElementById('num').textContent = DAYS

// ---------- 光柱几何（JS 版，和着色器里的 shaft() 一致） ----------
// 坐标：P = (x*aspect, y)，y 向上，0 在底 1 在顶。光从水面上的口子 A 往 D 方向扎下去，越往下越宽、越淡。
const FLOOR = x => 0.13 + 0.018 * Math.sin(x * 3.1 + 0.4) + 0.009 * Math.sin(x * 8.3 + 1.7)
function beams(sun, a) {
  const lean = -(sun - 0.5) * 0.95
  const D = norm([lean, -1])
  return [
    { A: [sun * a, 1.03], D, w0: 0.055, k: 0.20, s: 1.0 },
    { A: [(sun - 0.30) * a, 1.03], D: norm([lean * 1.15 - 0.05, -1]), w0: 0.025, k: 0.11, s: 0.38 },
    { A: [(sun + 0.27) * a, 1.03], D: norm([lean * 0.85 + 0.06, -1]), w0: 0.02, k: 0.10, s: 0.30 },
  ]
}
function norm(v) { const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l] }
function sstep(e0, e1, x) { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t) }
function shaftAt(px, py, b) {
  const rx = px - b.A[0], ry = py - b.A[1]
  const s = rx * b.D[0] + ry * b.D[1], pp = rx * -b.D[1] + ry * b.D[0]
  const w = b.w0 + Math.max(0, s) * b.k
  return sstep(w, w * 0.25, Math.abs(pp)) * sstep(0, 0.05, s) * Math.exp(-s * 0.85) * b.s
}
function lightAt(x, y, B, a) { let l = 0; for (const b of B) l += shaftAt(x * a, y, b); return Math.min(1.2, l) }

// ---------- 光：WebGL ----------
const glc = document.getElementById('gl')
const gl = glc.getContext('webgl', { antialias: false, premultipliedAlpha: false })
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`
const FS = `
precision highp float;
uniform vec2 R; uniform float T; uniform float SUN; uniform float BX; uniform float BL;
float floorY(float x){ return 0.13 + 0.018*sin(x*3.1+0.4) + 0.009*sin(x*8.3+1.7); }
float h1(float n){ return fract(sin(n)*43758.5453); }
float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h1(i), h1(i+1.), f); }
float caustic(vec2 uv, float t){
  vec2 p = mod(uv*6.2831, 6.2831) - 250.0;
  vec2 i = p; float c = 1.0; float inten = .005;
  for (int n=0; n<4; n++){
    float tt = t*(1.0-(3.5/float(n+1)));
    i = p + vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c += 1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0., 1.);
}
// 一根光柱：亮度＋柱内一条条细纹
float shaft(vec2 P, vec2 A, vec2 D, float w0, float k, float t, out float streak){
  vec2 r = P - A; float s = dot(r, D); float pp = dot(r, vec2(-D.y, D.x));
  float w = w0 + max(s, 0.)*k;
  float m = smoothstep(w, w*0.25, abs(pp)) * smoothstep(0., 0.05, s) * exp(-s*0.85);
  streak = 0.55 + 0.75*n1(pp/w*7.0 + t*0.25) * n1(pp/w*3.0 - t*0.17 + 9.0);
  return m;
}
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float a = R.x / R.y;
  vec2 P = vec2(uv.x*a, uv.y);
  float t = T;
  // 深水：几乎黑的藏青，越往上越带一点蓝
  vec3 col = mix(vec3(0.004, 0.012, 0.035), vec3(0.020, 0.060, 0.150), smoothstep(0.05, 1.0, uv.y));
  // 三根光柱
  float lean = -(SUN - 0.5)*0.95;
  vec2 D0 = normalize(vec2(lean, -1.)), D1 = normalize(vec2(lean*1.15 - 0.05, -1.)), D2 = normalize(vec2(lean*0.85 + 0.06, -1.));
  float st0, st1, st2;
  float b0 = shaft(P, vec2(SUN*a, 1.03), D0, 0.055, 0.20, t, st0);
  float b1 = shaft(P, vec2((SUN-0.30)*a, 1.03), D1, 0.025, 0.11, t+3., st1) * 0.38;
  float b2 = shaft(P, vec2((SUN+0.27)*a, 1.03), D2, 0.02, 0.10, t+7., st2) * 0.30;
  float fy = floorY(uv.x);
  float above = smoothstep(fy - 0.01, fy + 0.04, uv.y);
  float beam = (b0*st0 + b1*st1 + b2*st2) * above;
  col += vec3(0.38, 0.62, 1.00) * beam * 0.62;
  col += vec3(0.85, 0.93, 1.00) * pow(b0, 3.0) * 0.30 * above;   // 主光柱芯子发白
  // 水面：大部分是暗的波纹，只有光口那一块亮成一团
  // 1020 她：「顶上就好像只有中间那一块……太突兀」——水面整条都该有晃动的亮，离太阳越远越淡，光口本身更宽更软
  float surf = smoothstep(0.80, 1.0, uv.y);
  float sc = caustic(vec2(uv.x*a*1.4 + SUN*0.5, uv.y*4.0), t*0.5);
  float sc2 = caustic(vec2(uv.x*a*0.7 - SUN*0.3 + 3.0, uv.y*2.5), t*0.37);
  float near = exp(-abs(uv.x - SUN)*a*1.6);
  col += vec3(0.16, 0.30, 0.60) * surf * (0.16 + 0.22*near) * (0.6 + sc*0.9 + sc2*0.5);
  vec2 hole = vec2((uv.x - SUN)*a*0.55, (uv.y - 1.0)*2.0);
  float glow = exp(-dot(hole, hole)*14.0);
  col += vec3(0.62, 0.78, 1.00) * glow * (0.55 + sc*0.45);
  col += vec3(0.05, 0.10, 0.22) * smoothstep(0.6, 1.0, uv.y);   // 整个上半截稍亮一点，不让光口孤零零的
  // 沙地：本身很暗；光柱落地的那一块才有光网
  if (uv.y < fy) {
    float sd = (fy - uv.y) / fy;
    vec3 sand = mix(vec3(0.075, 0.090, 0.130), vec3(0.015, 0.020, 0.040), sd);
    sand *= 0.85 + 0.15*n1(uv.x*a*90.0 + uv.y*40.0);
    float yy = fy + 0.01;
    float s0, s1, s2;
    float lit = shaft(vec2(P.x, yy), vec2(SUN*a, 1.03), D0, 0.055, 0.20, t, s0)
              + 0.38*shaft(vec2(P.x, yy), vec2((SUN-0.30)*a, 1.03), D1, 0.025, 0.11, t, s1)
              + 0.30*shaft(vec2(P.x, yy), vec2((SUN+0.27)*a, 1.03), D2, 0.02, 0.10, t, s2);
    lit *= 2.6;
    vec2 cu = vec2(uv.x*a*(1.8 + sd*0.8) + (SUN-0.5)*0.9, (fy - uv.y)*(3.6 + sd*1.5));
    float c = caustic(cu, t*0.55);
    sand += vec3(0.45, 0.65, 0.95) * lit * (0.25 + c*1.1) * (1.0 - sd*0.6);
    // 瓶子透下来的彩斑：只在瓶子被光照到时出现，落在背光一侧
    float sx = BX + (BX - SUN)*0.18;
    vec2 q = vec2((uv.x - sx)*a/0.075, (uv.y - (floorY(BX) - 0.03))/0.02);
    float spot = exp(-dot(q, q)) * BL;
    vec3 hue = 0.5 + 0.5*cos(6.2831*(q.x*0.25 + vec3(0.0, 0.33, 0.67)) + t*0.4);
    sand += mix(vec3(0.40, 0.70, 0.80), hue, 0.22) * spot * 0.45;   // 1020 她：「打到水底的光有点太彩了」，彩虹压淡成一点青绿
    col = mix(col, sand, smoothstep(0.0, 0.006, fy - uv.y));
  }
  // 远处一层薄雾：靠中下方，给前后拉开一点距离
  col += vec3(0.02, 0.05, 0.11) * exp(-pow((uv.y - 0.35)*3.0, 2.0)) * 0.6;
  vec2 v = uv - vec2(0.5, 0.55); col *= 1.0 - dot(v, v)*0.9;
  gl_FragColor = vec4(col, 1.0);
}`

let U = {}, glOK = false
try {
  if (!gl) throw new Error('no webgl')
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s }
  const prog = gl.createProgram()
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS))
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog))
  gl.useProgram(prog)
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
  for (const k of ['R', 'T', 'SUN', 'BX', 'BL']) U[k] = gl.getUniformLocation(prog, k)
  glOK = true
} catch (e) { console.warn(e); document.getElementById('nogl').style.display = 'block' }

// ---------- 前景 ----------
const fg = document.getElementById('fg'), ctx = fg.getContext('2d')
let W = 0, H = 0, DPR = 1, AS = 1
const BX = 0.63
const X = x => x * W, Y = y => H * (1 - y)          // y 向上 → 屏幕
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  W = innerWidth; H = innerHeight; AS = W / H
  fg.width = W * DPR; fg.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  const s = 0.55
  glc.width = Math.round(W * s * DPR); glc.height = Math.round(H * s * DPR)
  if (glOK) gl.viewport(0, 0, glc.width, glc.height)
}
addEventListener('resize', resize); resize()

// 第四版（1020 她：「海草像硅胶触须」「区分不出石头和海草」）：不再画质感，全改剪影——
// 她发的参考图里鱼和石头都是黑剪影，只在朝光那侧被勾一道细亮边；形状本身把东西分开。
// 水草：细长的海藻，一根细茎、两边交替长着小叶片。depth 0 = 最近（黑、大、挪得多），1 = 最远（半透明蓝、小、挪得少）
const weeds = []
{
  let sd = 11; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647
  for (const [x0, x1, n, depth, h0, h1] of [[0.28, 0.58, 6, 1, 0.08, 0.16], [0.70, 0.99, 7, 0.4, 0.18, 0.40], [0.80, 1.02, 3, 0.1, 0.30, 0.50]])
    for (let i = 0; i < n; i++) weeds.push({ x: x0 + (x1 - x0) * r(), h: h0 + (h1 - h0) * r(), depth, ph: r() * 6.28, leaves: 7 + (r() * 6 | 0), lean: (r() - 0.5) * 0.3 })
  weeds.sort((a, b) => b.depth - a.depth)
}
function weedColor(depth, a) { // 远的偏环境蓝；近的几乎黑
  const r = 2 + depth * 18, g = 6 + depth * 34, b = 14 + depth * 66
  return `rgba(${r | 0},${g | 0},${b | 0},${a})`
}
function drawWeed(wd, t, par) {
  const bx = X(wd.x) + par * (1 - wd.depth) * 34, by = Y(FLOOR(wd.x)) + 3
  const len = H * wd.h, N = 18, sc = 1 - wd.depth * 0.45
  const pts = []
  for (let i = 0; i <= N; i++) {
    const u = i / N
    const sway = Math.sin(t * 0.7 + wd.ph + u * 2.2) * 16 * u * u * sc + Math.sin(t * 0.33 + wd.ph) * 6 * u + wd.lean * len * u
    pts.push([bx + sway, by - len * u])
  }
  const fill = weedColor(wd.depth, wd.depth === 1 ? 0.5 : 0.96)
  ctx.strokeStyle = fill; ctx.fillStyle = fill; ctx.lineCap = 'round'
  ctx.lineWidth = 2.2 * sc
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke()
  // 叶片：沿茎交替左右，越往上越小，跟着摆
  const lit = wd.depth < 1 ? lightAt(wd.x, FLOOR(wd.x) + wd.h * 0.6, B_now, AS) : 0
  for (let k = 0; k < wd.leaves; k++) {
    const u = 0.18 + k / wd.leaves * 0.78, i = Math.min(N - 1, Math.round(u * N))
    const [x, y] = pts[i], [x2, y2] = pts[i + 1]
    const side = k % 2 ? 1 : -1, ang = Math.atan2(y2 - y, x2 - x) + side * (0.75 + 0.15 * Math.sin(t * 0.9 + k + wd.ph))
    const ll = (18 - u * 9) * sc, lw = (4.5 - u * 2) * sc
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang)
    ctx.beginPath(); ctx.moveTo(0, 0)
    ctx.quadraticCurveTo(ll * 0.5, -lw, ll, 0); ctx.quadraticCurveTo(ll * 0.5, lw, 0, 0)
    ctx.fill()
    if (lit > 0.08) {   // 被光照到：叶片朝上的那条边一道细亮边
      ctx.strokeStyle = `rgba(130,180,250,${Math.min(0.6, lit * 0.7).toFixed(3)})`; ctx.lineWidth = 0.7
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(ll * 0.5, -lw, ll, 0); ctx.stroke()
      ctx.strokeStyle = fill
    }
    ctx.restore()
  }
}
let sunNow = 0.5, B_now = null

// 前景石头：左下角一整块圆钝的黑，只在上沿被光勾一道冷边
function rockPath() {
  const p = new Path2D()
  p.moveTo(-60, H + 10); p.lineTo(-60, H * 0.50)
  p.bezierCurveTo(W * 0.05, H * 0.47, W * 0.15, H * 0.53, W * 0.20, H * 0.62)
  p.bezierCurveTo(W * 0.25, H * 0.70, W * 0.24, H * 0.78, W * 0.33, H * 0.85)
  p.bezierCurveTo(W * 0.42, H * 0.91, W * 0.47, H * 0.96, W * 0.50, H + 10)
  p.closePath(); return p
}
function drawRock(par, B) {
  const o = par * 46
  ctx.save(); ctx.translate(o, 0)
  const path = rockPath()
  // 剪影本体：几乎黑，往里稍微有一点点体积（中间比边更黑）
  const g = ctx.createRadialGradient(W * 0.02, H * 0.85, 10, W * 0.02, H * 0.85, W * 0.5)
  g.addColorStop(0, '#000105'); g.addColorStop(1, '#030915')
  ctx.fillStyle = g; ctx.fill(path)
  // 上沿冷边：光柱扫过来时更亮；用模糊的粗线叠细线，像水里散开的光
  const lt = Math.min(1, lightAt(0.2, 0.4, B, AS) * 2)
  ctx.save(); ctx.clip(path)
  ctx.strokeStyle = `rgba(90,140,220,${(0.10 + lt * 0.25).toFixed(3)})`; ctx.lineWidth = 9; ctx.filter = 'blur(4px)'; ctx.stroke(path)
  ctx.filter = 'none'
  ctx.restore()
  ctx.strokeStyle = `rgba(150,195,255,${(0.18 + lt * 0.45).toFixed(3)})`; ctx.lineWidth = 1.2; ctx.stroke(path)
  ctx.restore()
}

// 远处的鱼影：小、淡，慢慢横着游过去
const fish = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: 0.45 + Math.random() * 0.3, s: 0.5 + Math.random() * 0.6, v: 0.012 + Math.random() * 0.01, dir: i % 2 ? 1 : -1, ph: Math.random() * 6 }))
function drawFish(f, t, dt, B, par) {
  f.x += f.v * f.dir * dt
  if (f.x > 1.15) f.x = -0.15; if (f.x < -0.15) f.x = 1.15
  const x = X(f.x) + par * 10, y = Y(f.y + Math.sin(t * 0.5 + f.ph) * 0.008), L = 26 * f.s
  const lit = lightAt(f.x, f.y, B, AS)
  ctx.save(); ctx.translate(x, y); ctx.scale(f.dir, 1)
  ctx.beginPath()
  ctx.moveTo(L * 0.5, 0)
  ctx.quadraticCurveTo(L * 0.1, -L * 0.22, -L * 0.3, -L * 0.04)
  ctx.lineTo(-L * 0.52, -L * 0.18 + Math.sin(t * 6 + f.ph) * 2); ctx.lineTo(-L * 0.46, 0); ctx.lineTo(-L * 0.52, L * 0.18 + Math.sin(t * 6 + f.ph) * 2)
  ctx.lineTo(-L * 0.3, L * 0.04)
  ctx.quadraticCurveTo(L * 0.1, L * 0.22, L * 0.5, 0)
  ctx.fillStyle = `rgba(${(10 + lit * 60) | 0},${(25 + lit * 80) | 0},${(55 + lit * 120) | 0},${(0.45 + lit * 0.3).toFixed(2)})`
  ctx.fill(); ctx.restore()
}

// 瓶子：躺在沙上；进了光才亮，背光一侧拖影子
function drawBottle(t, B, sun, par) {
  const bx = BX + par * 0.012
  const x = X(bx), y = Y(FLOOR(BX)) - 2, L = Math.min(W, H) * 0.19, R = L * 0.22
  const lit = Math.min(1, lightAt(BX, FLOOR(BX) + 0.03, B, AS) * 1.6)
  // 影子：往背着光的那边拖
  const sdx = (BX - sun) * L * 1.2
  ctx.save(); ctx.translate(x + sdx * 0.5, y + R * 0.8)
  const sg = ctx.createRadialGradient(0, 0, 2, 0, 0, L * 0.7)
  sg.addColorStop(0, `rgba(0,0,6,${(0.35 + lit * 0.35).toFixed(2)})`); sg.addColorStop(1, 'rgba(0,0,6,0)')
  ctx.scale(1 + Math.abs(sdx) / L, 0.18); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, L * 0.7, 0, Math.PI * 2); ctx.fill()
  ctx.restore()
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12)
  // 圆筒感（1020 她：「瓶子还是太平了」）：横截面上两边玻璃厚、颜色深，中间透；顶上一道长高光、底下一道反光；
  // 瓶底画成椭圆端面，瓶口单独一截细颈
  const body = new Path2D()
  body.moveTo(-L / 2, -R); body.lineTo(L * 0.20, -R)
  body.bezierCurveTo(L * 0.30, -R, L * 0.33, -R * 0.42, L * 0.40, -R * 0.40); body.lineTo(L / 2, -R * 0.40)
  body.lineTo(L / 2, R * 0.40); body.lineTo(L * 0.40, R * 0.40)
  body.bezierCurveTo(L * 0.33, R * 0.42, L * 0.30, R, L * 0.20, R); body.lineTo(-L / 2, R)
  body.ellipse(-L / 2, 0, R * 0.32, R, 0, Math.PI / 2, Math.PI * 1.5); body.closePath()
  const k = lit
  // 第四版：玻璃靠边上的反光认出来，不靠填色（1020 她：「还是没有玻璃的感觉」「里面不知道是小纸条还是什么」）
  // 本体只比水暗一点点、透出后面；纸条去掉
  ctx.fillStyle = `rgba(2,10,22,${(0.30 + k * 0.05).toFixed(3)})`; ctx.fill(body)
  ctx.save(); ctx.clip(body)
  // 玻璃两边厚处一道暗、一道亮的折射边（顺着瓶身）
  for (const [yy, c] of [[-R * 0.80, `rgba(150,200,255,${(0.10 + k * 0.35).toFixed(3)})`], [R * 0.78, `rgba(120,170,230,${(0.06 + k * 0.22).toFixed(3)})`]]) {
    ctx.strokeStyle = c; ctx.lineWidth = R * 0.12
    ctx.beginPath(); ctx.moveTo(-L * 0.48, yy); ctx.lineTo(L * 0.18, yy); ctx.stroke()
  }
  // 光穿过瓶子在底部聚成一小块亮（玻璃像透镜）
  const fg2 = ctx.createRadialGradient(-L * 0.05, R * 0.55, 0, -L * 0.05, R * 0.55, L * 0.25)
  fg2.addColorStop(0, `rgba(170,215,255,${(k * 0.35).toFixed(3)})`); fg2.addColorStop(1, 'rgba(170,215,255,0)')
  ctx.fillStyle = fg2; ctx.fillRect(-L / 2, -R, L, R * 2)
  ctx.restore()
  // 轮廓：上缘亮、下缘暗
  const og = ctx.createLinearGradient(0, -R, 0, R)
  og.addColorStop(0, `rgba(190,225,255,${(0.25 + k * 0.5).toFixed(3)})`); og.addColorStop(1, `rgba(120,160,200,${(0.10 + k * 0.2).toFixed(3)})`)
  ctx.strokeStyle = og; ctx.lineWidth = 1.3; ctx.stroke(body)
  // 瓶底端面（看得出是圆筒）和底部那圈厚玻璃
  ctx.strokeStyle = `rgba(170,210,250,${(0.18 + k * 0.35).toFixed(3)})`; ctx.lineWidth = 1
  ctx.beginPath(); ctx.ellipse(-L / 2, 0, R * 0.32, R * 0.98, 0, 0, Math.PI * 2); ctx.stroke()
  ctx.beginPath(); ctx.ellipse(-L / 2 + R * 0.12, 0, R * 0.16, R * 0.55, 0, 0, Math.PI * 2); ctx.stroke()
  // 瓶口一圈唇＋软木塞（塞子也是圆柱：上亮下暗）
  ctx.beginPath(); ctx.ellipse(L / 2, 0, R * 0.12, R * 0.42, 0, 0, Math.PI * 2); ctx.stroke()
  const cg = ctx.createLinearGradient(0, -R * 0.34, 0, R * 0.34)
  cg.addColorStop(0, `rgb(${(90 + k * 110) | 0},${(65 + k * 80) | 0},${(40 + k * 50) | 0})`); cg.addColorStop(1, `rgb(${(35 + k * 50) | 0},${(25 + k * 35) | 0},${(18 + k * 22) | 0})`)
  ctx.fillStyle = cg; ctx.fillRect(L / 2, -R * 0.33, R * 0.45, R * 0.66)
  ctx.beginPath(); ctx.ellipse(L / 2 + R * 0.45, 0, R * 0.08, R * 0.33, 0, 0, Math.PI * 2); ctx.fill()
  // 顶上一道长高光（受光越多越亮，位置跟着太阳挪一点）
  const hx = (sun - BX) * L * 0.6
  const hg = ctx.createLinearGradient(-L * 0.45 + hx, 0, L * 0.25 + hx, 0)
  hg.addColorStop(0, 'rgba(255,255,255,0)'); hg.addColorStop(.35, `rgba(235,245,255,${(0.18 + k * 0.6).toFixed(3)})`)
  hg.addColorStop(.7, `rgba(235,245,255,${(0.10 + k * 0.35).toFixed(3)})`); hg.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = hg
  ctx.beginPath(); ctx.ellipse(-L * 0.1 + hx, -R * 0.62, L * 0.34, R * 0.09, 0, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = `rgba(240,250,255,${(0.15 + k * 0.5).toFixed(3)})`
  ctx.beginPath(); ctx.ellipse(L * 0.36, -R * 0.36, L * 0.03, R * 0.05, -0.4, 0, Math.PI * 2); ctx.fill()  // 瓶肩一点
  ctx.restore()
}

// 羽毛：一根羽轴、两边一排排羽枝（左宽右窄、有两处分叉），慢慢晃着沉下去，进光时边上泛蓝紫
const feather = { x: 0.40, y: 1.08, rot: 0.4, rest: 0 }
function stepFeather(dt, t) {
  const f = feather, ground = FLOOR(f.x) + 0.012
  if (f.y > ground) {
    f.y -= dt * 0.016
    f.x += Math.sin(t * 0.8) * dt * 0.014
    f.rot = 0.5 + Math.sin(t * 0.8) * 0.55
  } else { f.rot += (1.35 - f.rot) * Math.min(1, dt * 2); if ((f.rest += dt) > 14) Object.assign(f, { x: 0.25 + Math.random() * 0.35, y: 1.08, rest: 0 }) }
}
function drawFeather(B) {
  const f = feather, L = Math.min(W, H) * 0.15
  const lit = Math.min(1, lightAt(f.x, f.y, B, AS) * 1.5)
  ctx.save(); ctx.translate(X(f.x), Y(f.y)); ctx.rotate(f.rot)
  // 第三版（她：「羽毛有点怪」，第二版一根根羽枝分太开像蕨菜）：先填整片羽片（左宽右窄、尖上圆），
  // 再在上面刷细羽枝纹；切两道小口子当分叉；根上一撮绒毛；下面露一截羽管
  const ax = u => Math.sin(u * Math.PI) * L * 0.035          // 羽轴的弯
  const ay = u => L * 0.45 - u * L * 0.95                     // u: 0 根 → 1 尖
  const prof = u => Math.pow(Math.sin(Math.min(1, u * 1.08) * Math.PI * 0.5 + 0.0001), 0.6) * (1 - Math.pow(u, 3)) * Math.min(1, u * 5)
  const vane = new Path2D(), M = 40
  for (let i = 0; i <= M; i++) { const u = i / M; const p = [ax(u) - L * 0.17 * prof(u), ay(u) - L * 0.05 * prof(u)]; i ? vane.lineTo(...p) : vane.moveTo(...p) }
  for (let i = M; i >= 0; i--) { const u = i / M; vane.lineTo(ax(u) + L * 0.095 * prof(u), ay(u) - L * 0.035 * prof(u)) }
  vane.closePath()
  // 第四版：剪影——羽片几乎黑，只在受光那侧勾一道细亮边（她：「羽毛还是有问题」，紫色渐变和白羽轴都显假）
  const vg = `rgba(${(4 + lit * 10) | 0},${(5 + lit * 12) | 0},${(10 + lit * 22) | 0},.96)`
  ctx.fillStyle = vg; ctx.fill(vane)
  ctx.save(); ctx.clip(vane)
  // 两道分叉：用背景色细细划开
  ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(0,0,0,1)'
  for (const [u, side] of [[0.46, -1], [0.68, 1]]) {
    const x0 = ax(u) + side * L * 0.02, y0 = ay(u)
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + side * L * 0.2, y0 - L * 0.075); ctx.stroke()
  }
  ctx.restore()
  // 根上的绒毛
  ctx.strokeStyle = `rgba(${(40 + lit * 60) | 0},${(42 + lit * 60) | 0},${(60 + lit * 80) | 0},.55)`; ctx.lineWidth = 0.7
  for (let i = 0; i < 14; i++) {
    const u = 0.02 + i * 0.008, x0 = ax(u), y0 = ay(u), s = i % 2 ? 1 : -1
    ctx.beginPath(); ctx.moveTo(x0, y0)
    ctx.bezierCurveTo(x0 + s * L * 0.05, y0 - L * 0.01, x0 + s * L * 0.07, y0 + L * 0.03, x0 + s * L * (0.06 + (i % 3) * 0.02), y0 + L * 0.02)
    ctx.stroke()
  }
  // 受光一侧的细亮边＋暗的羽管
  ctx.strokeStyle = `rgba(140,180,240,${(0.10 + lit * 0.55).toFixed(3)})`; ctx.lineWidth = 0.9
  ctx.beginPath()
  for (let i = 0; i <= 30; i++) { const u = i / 30; const p = [ax(u) + L * 0.095 * prof(u), ay(u) - L * 0.035 * prof(u)]; i ? ctx.lineTo(...p) : ctx.moveTo(...p) }
  ctx.stroke()
  ctx.strokeStyle = 'rgba(6,8,14,.95)'; ctx.lineCap = 'round'; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.moveTo(0, L * 0.58); ctx.lineTo(ax(0), ay(0)); ctx.stroke()
  ctx.restore()
}

// 亮晶晶：大多数生在光柱里、慢慢往下飘；柱子外面也有，但暗得几乎看不见
const SPARK_N = 320
const sparks = Array.from({ length: SPARK_N }, () => spawnSpark({}, true))
function spawnSpark(p, anyY) {
  p.x = Math.random(); p.y = anyY ? 0.1 + Math.random() * 0.92 : 1.0 + Math.random() * 0.05
  p.r = Math.random() < 0.1 ? 1.1 + Math.random() * 0.8 : 0.35 + Math.random() * 0.7   // 1020 她：光点还是太大
  p.v = 0.006 + Math.random() * 0.018; p.ph = Math.random() * 6.28; p.gold = Math.random() < 0.06
  return p
}
let B0 = beams(0.5, AS)
function placeInBeam(p) {
  // 让一大半的颗粒落在主光柱里：沿着光柱随机取一点
  const b = B0[Math.random() < 0.8 ? 0 : 1 + (Math.random() < 0.5 ? 1 : 0)]
  const s = Math.random() * 1.0, w = b.w0 + s * b.k
  const pp = (Math.random() + Math.random() - 1) * w
  const px = b.A[0] + b.D[0] * s - b.D[1] * pp, py = b.A[1] + b.D[1] * s + b.D[0] * pp
  p.x = px / AS; p.y = py
}
for (const p of sparks) if (Math.random() < 0.7) placeInBeam(p)
function drawSparks(t, dt, B) {
  ctx.globalCompositeOperation = 'lighter'
  for (const p of sparks) {
    p.y -= p.v * dt; p.x += Math.sin(t * 0.4 + p.ph) * 0.0008
    if (p.y < FLOOR(p.x) + 0.01 || p.x < -0.05 || p.x > 1.05) { spawnSpark(p, false); if (Math.random() < 0.75) placeInBeam(p) }
    const L = lightAt(p.x, p.y, B, AS)
    const tw = 0.55 + 0.45 * Math.sin(t * (1.5 + p.r) + p.ph * 3)
    const a = (0.04 + L * 0.95) * tw
    if (a < 0.02) continue
    const x = X(p.x), y = Y(p.y)
    ctx.fillStyle = p.gold ? `rgba(255,214,150,${a.toFixed(3)})` : `rgba(205,228,255,${a.toFixed(3)})`
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill()
    if (p.r > 1.1 && L > 0.3) {  // 大颗的带一点光晕和十字闪；光晕要中间亮往外散（1020 第二版画成实心圆，她看成「套了一圈小圆圈」）
      const hr = p.r * 2.6
      const hg = ctx.createRadialGradient(x, y, 0, x, y, hr)
      const c = p.gold ? '255,205,140' : '170,205,255'
      hg.addColorStop(0, `rgba(${c},${(a * 0.35).toFixed(3)})`); hg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y, hr, 0, Math.PI * 2); ctx.fill()
      const sl = p.r * 3.5 * tw
      const lg = ctx.createLinearGradient(x - sl, y, x + sl, y)
      lg.addColorStop(0, `rgba(${c},0)`); lg.addColorStop(.5, `rgba(${c},${(a * 0.5).toFixed(3)})`); lg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = lg; ctx.fillRect(x - sl, y - 0.35, sl * 2, 0.7)
      const vg = ctx.createLinearGradient(x, y - sl, x, y + sl)
      vg.addColorStop(0, `rgba(${c},0)`); vg.addColorStop(.5, `rgba(${c},${(a * 0.5).toFixed(3)})`); vg.addColorStop(1, `rgba(${c},0)`)
      ctx.fillStyle = vg; ctx.fillRect(x - 0.35, y - sl, 0.7, sl * 2)
    }
  }
  ctx.globalCompositeOperation = 'source-over'
}

// 气泡：偶尔从水草根和瓶口冒
const bubbles = []
function stepBubbles(dt) {
  if (Math.random() < dt * 0.4) {
    const src = Math.random() < 0.6 ? weeds[3 + Math.floor(Math.random() * 3)].x : BX + 0.09
    bubbles.push({ x: src, y: FLOOR(src) + 0.02, r: 1.5 + Math.random() * 3, ph: Math.random() * 6 })
  }
  for (const b of bubbles) { b.y += dt * (0.03 + b.r * 0.006); b.ph += dt * 3 }
  while (bubbles.length && bubbles[0].y > 0.97) bubbles.shift()
}
function drawBubbles(B) {
  for (const b of bubbles) {
    const L = lightAt(b.x, b.y, B, AS)
    const x = X(b.x) + Math.sin(b.ph) * 3, y = Y(b.y)
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2)
    ctx.strokeStyle = `rgba(200,225,255,${(0.18 + L * 0.6).toFixed(2)})`; ctx.lineWidth = 1; ctx.stroke()
  }
}

// ---------- 歪手机 ----------
let target = 0.5, sun = 0.5, tilted = false
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return
  target = 0.5 + Math.max(-1, Math.min(1, e.gamma / 40)) * 0.40
  if (Math.abs(e.gamma) > 6 && !tilted) { tilted = true; document.getElementById('hint').style.opacity = 0 }
})
addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) target = 0.1 + 0.8 * (e.clientX / W) })
setTimeout(() => { document.getElementById('hint').style.opacity = 0 }, 6000)

const numEl = document.getElementById('num')
let last = performance.now(), t0 = last, running = true
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame) } })
function frame(now) {
  if (!running) return
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  const t = (now - t0) / 1000
  sun += (target - sun) * Math.min(1, dt * 3)
  const par = (sun - 0.5) * 2          // -1..1，视差用
  const B = beams(sun, AS); B0 = B; B_now = B; sunNow = sun
  const BL = Math.min(1, lightAt(BX, FLOOR(BX) + 0.03, B, AS) * 1.6)
  if (glOK) {
    gl.uniform2f(U.R, glc.width, glc.height); gl.uniform1f(U.T, t)
    gl.uniform1f(U.SUN, sun); gl.uniform1f(U.BX, BX); gl.uniform1f(U.BL, BL)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }
  ctx.clearRect(0, 0, W, H)
  for (const w of weeds) if (w.depth === 1) drawWeed(w, t, par)       // 远处
  for (const f of fish) drawFish(f, t, dt, B, par)
  drawSparks(t, dt, B)
  drawBottle(t, B, sun, par)
  stepFeather(dt, t); drawFeather(B)
  stepBubbles(dt); drawBubbles(B)
  for (const w of weeds) if (w.depth < 1) drawWeed(w, t, par)         // 近处
  drawRock(par, B)
  // 数字：被光柱扫到时亮
  const L = Math.min(1, lightAt(0.5, 0.72, B, AS) * 1.4)
  const g = 0.25 + L * 0.75
  numEl.style.textShadow = `0 0 ${(14 + g * 34).toFixed(1)}px rgba(160,200,255,${(0.15 + g * 0.5).toFixed(3)}), 0 2px 14px rgba(0,5,20,.6)`
  numEl.style.opacity = (0.72 + g * 0.28).toFixed(3)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
