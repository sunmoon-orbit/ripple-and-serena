<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贴图架</title>
<style>
  :root { --bg: #f1ede6; --paper: #fbf9f4; --ink: #2f2b27; --dim: #8a8278; --line: #ddd5c8; --accent: #8a6a4a; --off: #c9c2b6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --paper: #24221f; --ink: #e2dcd1; --dim: #948c80; --line: #3a3631; --accent: #c9a678; --off: #4a453e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.7 -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 720px; margin: 0 auto; }
  h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 22px 2px 10px; letter-spacing: 1px; }
  .tip { color: var(--dim); font-size: 12.5px; margin: 6px 2px 12px; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .btn.go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
  .row img { width: 64px; height: 64px; object-fit: contain; border-radius: 10px; background: var(--paper); flex: none; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px 8px; }
  .cell { text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cell img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 12px; background: var(--paper); display: block; }
  .cell span { display: block; font-size: 11.5px; line-height: 1.35; color: var(--dim); margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .cell.noai img { opacity: .45; } .cell.noai span::after { content: '（他不用）'; }
  .cell.on img { outline: 2px solid var(--accent); }
  #edit { position: sticky; bottom: 10px; margin-top: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  #edit[hidden] { display: none; }
  .sw { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; margin: 6px 0; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .acts .msg { margin-right: auto; color: var(--accent); font-size: 12.5px; }
  .danger { color: #b5574a; border-color: transparent; }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn go" id="pick" type="button">＋ 选图片加进来</button>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <div class="tip">他只靠名字认图，看不到画面。名字写它在说什么，比如「委屈巴巴」「摸摸头」；图上有字就直接写那行字。动图会原样保留。</div>
  <div id="queue"></div>

  <h2>我加的</h2>
  <div class="grid" id="mine"></div>
  <h2>原来就有的</h2>
  <div class="tip">点一张可以改它的名字，或者关掉「他能用」。原来就有的删不了。</div>
  <div class="grid" id="base"></div>

  <div id="edit" hidden>
    <div class="row"><img id="e-img" alt=""><input type="text" id="e-name" maxlength="40" autocomplete="off"></div>
    <label class="sw"><input type="checkbox" id="e-ai"> 他能用（关掉以后他不会发这张，你自己照样能发）</label>
    <div class="acts"><span class="msg" id="e-msg"></span><button class="btn danger" id="e-del" type="button">删掉</button><button class="btn" id="e-x" type="button">收起</button><button class="btn go" id="e-save" type="button">存</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id)
const AUTH = { Authorization: 'Bearer ' + (localStorage.getItem('raven-token') || '') }
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
const src = f => '/raven/stickers/' + encodeURIComponent(f)
let all = [], cur = null
const post = async (path, body) => {
  const r = await fetch(path, { method: 'POST', headers: { ...AUTH, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const d = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(d.error || r.status)
  return d
}
async function load() {
  const r = await fetch('/raven/stickers/index.json', { cache: 'no-store' })
  all = (await r.json()).stickers || []
  for (const [box, list] of [[$('mine'), all.filter(s => s.mine)], [$('base'), all.filter(s => !s.mine)]]) {
    box.innerHTML = ''
    if (!list.length) { box.appendChild(el('div', 'empty', '还没有。')); continue }
    for (const s of list) {
      const c = el('div', 'cell' + (s.ai === false ? ' noai' : '') + (cur === s.file ? ' on' : ''))
      const img = el('img'); img.src = src(s.file); img.loading = 'lazy'; img.alt = s.name || s.file
      c.append(img, el('span', null, s.name || '（没名字）'))
      c.onclick = () => open(s.file)
      box.appendChild(c)
    }
  }
}
function open(file) {
  const s = all.find(x => x.file === file); if (!s) return
  cur = file
  $('e-img').src = src(file); $('e-name').value = s.name || ''; $('e-ai').checked = s.ai !== false
  $('e-del').hidden = !s.mine; $('e-msg').textContent = ''; $('edit').hidden = false
  document.querySelectorAll('.cell.on').forEach(n => n.classList.remove('on'))
}
$('e-x').onclick = () => { $('edit').hidden = true; cur = null }
$('e-save').onclick = async () => {
  try { await post('/raven/stickers/update', { file: cur, name: $('e-name').value, ai: $('e-ai').checked }); $('e-msg').textContent = '存好了'; await load() }
  catch (e) { $('e-msg').textContent = '没存上：' + e.message }
}
// 删除要点两下：第一下只是把字换成「再点一次就删」
let delArmed = 0
$('e-del').onclick = async () => {
  if (Date.now() - delArmed > 4000) { delArmed = Date.now(); $('e-del').textContent = '再点一次就删'; setTimeout(() => { $('e-del').textContent = '删掉' }, 4000); return }
  delArmed = 0
  try { await post('/raven/stickers/update', { file: cur, remove: true }); $('edit').hidden = true; cur = null; $('e-del').textContent = '删掉'; await load() }
  catch (e) { $('e-msg').textContent = '没删掉：' + e.message }
}
// 上传：选完先排成一列，每张填个名字，再一起存。没填名字的那张留在原地不传
$('pick').onclick = () => $('files').click()
$('files').onchange = () => {
  const q = $('queue')
  for (const f of $('files').files) {
    const row = el('div', 'row'); const img = el('img'); const name = el('input'); name.type = 'text'; name.maxLength = 40; name.placeholder = '它在说什么'
    const note = el('span', 'tip'); note.style.margin = '0'
    if (f.size > 5 * 1024 * 1024) { note.textContent = '超过 5MB，传不了'; name.disabled = true }
    const fr = new FileReader(); fr.onload = () => { img.src = fr.result; row._data = fr.result }; fr.readAsDataURL(f)
    row.append(img, name, note); row._name = name; row._note = note; q.appendChild(row)
  }
  $('files').value = ''
  if (!$('save-all')) { const b = el('button', 'btn go', '存这几张'); b.id = 'save-all'; b.type = 'button'; b.onclick = saveAll; q.after(b) }
}
async function saveAll() {
  const b = $('save-all'); b.disabled = true
  for (const row of [...$('queue').children]) {
    const name = row._name.value.trim()
    if (row._name.disabled) continue
    if (!name) { row._note.textContent = '还没起名字'; continue }
    if (!row._data) { row._note.textContent = '图还没读完，再点一次'; continue }
    try { await post('/raven/stickers/upload', { name, data: row._data }); row.remove() }
    catch (e) { row._note.textContent = '没传上：' + e.message }
  }
  b.disabled = false
  if (!$('queue').children.length) b.remove()
  await load()
}
load().catch(e => { $('mine').appendChild(el('div', 'empty', '没翻开（' + e.message + '）')) })
</script>
</body>
</html>
