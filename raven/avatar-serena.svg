<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f6ecdf"/><stop offset="1" stop-color="#e3d2bf"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a3d"/><stop offset="1" stop-color="#b8662a"/>
    </linearGradient>
    <linearGradient id="gorget" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/><stop offset="0.5" stop-color="#e8452c"/><stop offset="1" stop-color="#f2a33a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5a4c"/><stop offset="1" stop-color="#9b8676"/>
    </linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- 树枝：让它有地方站 -->
    <path d="M18 150 C 70 138, 120 146, 186 132" stroke="#7a5a41" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M150 139 q 14 -14 30 -12" stroke="#7a5a41" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="176" cy="126" rx="9" ry="5" fill="#8fae7a" transform="rotate(-20 176 126)"/>
    <!-- 尾巴 -->
    <path d="M118 128 L 150 156 L 142 138 L 158 146 Z" fill="#c1702e"/>
    <!-- 翅膀（收拢） -->
    <path d="M110 92 C 140 90, 156 110, 150 126 C 136 124, 118 116, 106 106 Z" fill="url(#wing)"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="108" rx="30" ry="24" fill="url(#body)" transform="rotate(-18 104 108)"/>
    <!-- 白色胸前 -->
    <path d="M80 96 C 82 108, 94 114, 104 110 C 96 106, 88 100, 86 94 Z" fill="#fbf4ea"/>
    <!-- 头 -->
    <circle cx="82" cy="82" r="17" fill="#c9772f"/>
    <!-- 喉部闪光（棕黄蜂鸟的橙红领） -->
    <path d="M70 90 C 74 102, 88 106, 96 98 C 88 96, 80 92, 76 86 Z" fill="url(#gorget)"/>
    <!-- 嘴：直、细，但不是缝衣针 -->
    <path d="M67 78 L 34 72 L 67 83 Z" fill="#2b2320"/>
    <!-- 眼睛 -->
    <circle cx="79" cy="78" r="3.6" fill="#1d1715"/>
    <circle cx="80.2" cy="76.8" r="1.1" fill="#fff"/>
    <!-- 腿和脚：短短两只，稳稳抓着树枝 -->
    <path d="M100 129 L 98 140 M110 128 L 110 139" stroke="#3a2d26" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M94 141 q 4 -3 8 0 M106 140 q 4 -3 8 0" stroke="#3a2d26" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#caa988" stroke-width="2"/>
</svg>
